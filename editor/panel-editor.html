<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧩 面板编辑器 - 游戏编辑器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; background: #0a0a1e; color: #fff; min-height: 100vh; overflow: hidden; }
        .editor-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; background: #16213e; border-bottom: 1px solid #2a3a5e; }
        .editor-header h1 { font-size: 18px; color: #4CAF50; }
        .editor-header nav { display: flex; gap: 8px; }
        .editor-header nav button { padding: 6px 12px; background: #3a4a7e; border: none; border-radius: 4px; color: #fff; cursor: pointer; font-size: 13px; }
        .editor-header nav button:hover { background: #4a5a9e; }
        .editor-header nav button.active { background: #4CAF50; color: #000; }
        .editor-main { height: calc(100vh - 52px); overflow: hidden; }
        .panel-container { height: 100%; overflow: hidden; }
    </style>
</head>
<body>
    <div id="editor-nav"></div>
    <div class="editor-main">
        <div class="panel-container" id="panel-editor-container"></div>
    </div>
    <script type="module">
        import { EditorPageContext, renderEditorNav } from './EditorShared.js';
        import { PanelEditor } from './PanelEditor.js';

        (async () => {
            renderEditorNav('panel-editor');
            const ctx = new EditorPageContext();
            await ctx.init();
            const gameId = new URLSearchParams(location.search).get('gameId');
            if (!gameId) { alert('请先选择游戏'); window.location.href = 'index.html'; return; }

            const editor = new PanelEditor(document.getElementById('panel-editor-container'), {
                gameId,
                canonicalSession: ctx._canonicalEditorSession('project')
            });
            await editor.init();
        })().catch(error => {
            console.error('[PanelEditor] 初始化失败', error);
            const container = document.getElementById('panel-editor-container');
            if (container) container.textContent = `面板编辑器初始化失败：${error?.message || String(error)}`;
        });
    </script>
</body>
</html>
