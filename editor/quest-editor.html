<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📋 任务 - 游戏编辑器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; background: #0a0a1e; color: #fff; min-height: 100vh; overflow: hidden; }
        .editor-main { height: calc(100vh - 52px); overflow: hidden; }
        .panel-container { height: 100%; overflow: hidden; }
    </style>
</head>
<body>
    <div id="editor-nav"></div>
    <div class="editor-main">
        <div class="panel-container" id="quest-wizard-container"></div>
    </div>
    <script type="module">
        import { EditorPageContext, renderEditorNav } from './EditorShared.js';
        import { QuestWizardEditor } from './QuestWizardEditor.js';

        (async () => {
            renderEditorNav('quest-editor');
            const ctx = new EditorPageContext();
            await ctx.init();
            const gameId = new URLSearchParams(location.search).get('gameId');
            if (!gameId) { alert('请先选择游戏'); window.location.href = 'index.html'; return; }

            // 任务编辑器：quests[]（Quest v2）的唯一编辑入口；
            // 编译产物（taskGraph + 触发器）由 QuestRuntime 在保存后自动生成，预览见「⚙ 编译预览」。
            const editor = new QuestWizardEditor(document.getElementById('quest-wizard-container'), {
                canonicalSession: ctx._canonicalEditorSession('project'),
                projectPath: ctx._canonicalProjectPath(),
                getSceneList: () => ctx.dataManager.getGameScenes(gameId),
                getSceneDocuments: () => ctx.getSceneDocuments()
            });
            await editor.init();
        })().catch(error => {
            console.error('[QuestEditorPage] 初始化失败', error);
            const container = document.getElementById('quest-wizard-container');
            if (container) container.textContent = `任务编辑器初始化失败：${error?.message || String(error)}`;
        });
    </script>
</body>
</html>
