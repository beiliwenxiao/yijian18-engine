<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🗺️ 场景编辑器 - 游戏编辑器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; background: #0a0a1e; color: #fff; min-height: 100vh; overflow: hidden; }
        .editor-app { display: flex; flex-direction: column; height: 100vh; }
        .editor-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; background: #16213e; border-bottom: 1px solid #2a3a5e; flex-shrink: 0; }
        .editor-header h1 { font-size: 18px; color: #4CAF50; }
        .editor-header nav { display: flex; gap: 8px; }
        .editor-header nav button { padding: 6px 12px; background: #3a4a7e; border: none; border-radius: 4px; color: #fff; cursor: pointer; font-size: 13px; }
        .editor-header nav button:hover { background: #4a5a9e; }
        .editor-header nav button.active { background: #4CAF50; color: #000; }
        .editor-main { flex: 1; display: flex; overflow: hidden; }
        .scene-sidebar { width: 240px; background: #16213e; border-right: 1px solid #2a3a5e; display: flex; flex-direction: column; flex-shrink: 0; }
        .scene-sidebar-header { padding: 12px; border-bottom: 1px solid #2a3a5e; }
        .scene-sidebar-header h3 { font-size: 14px; margin-bottom: 8px; }
        .scene-filter { display: flex; gap: 6px; }
        .scene-filter select { flex: 1; padding: 4px 8px; background: #0a0a1e; border: 1px solid #2a3a5e; border-radius: 4px; color: #fff; font-size: 12px; }
        .scene-list { flex: 1; overflow-y: auto; padding: 8px; }
        .scene-item { padding: 8px 10px; background: #1a2a4e; border-radius: 4px; margin-bottom: 6px; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: space-between; }
        .scene-item:hover { background: #2a3a5e; }
        .scene-item.active { background: #4CAF50; color: #000; }
        .scene-item .scene-id { font-size: 11px; color: #888; }
        .scene-item.active .scene-id { color: #006600; }
        .scene-item .scene-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .scene-item .scene-actions { display: flex; align-items: center; gap: 4px; }
        .scene-item .scene-actions button { padding: 2px 6px; background: #3a4a7e; border: none; border-radius: 3px; color: #fff; cursor: pointer; font-size: 11px; }
        .scene-item .scene-actions button:hover { background: #4a5a9e; }
        .scene-item.template-item { border-left: 2px solid #8bc34a; }
        .scene-sidebar-footer { padding: 8px; border-top: 1px solid #2a3a5e; display: flex; gap: 6px; }
        .scene-sidebar-footer button { flex: 1; padding: 6px; background: #3a4a7e; border: none; border-radius: 4px; color: #fff; cursor: pointer; font-size: 12px; }
        .scene-sidebar-footer button:hover { background: #4a5a9e; }
        .editor-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .editor-tabs { display: flex; background: #16213e; border-bottom: 1px solid #2a3a5e; flex-shrink: 0; }
        .editor-tabs button { padding: 10px 20px; background: transparent; border: none; color: #aaa; cursor: pointer; font-size: 13px; border-bottom: 2px solid transparent; }
        .editor-tabs button:hover { color: #fff; }
        .editor-tabs button.active { color: #4CAF50; border-bottom-color: #4CAF50; }
        /* 标签栏右侧弹层入口（按钮写法/物体写法），不参与标签切换 */
        .editor-tabs button.tab-extra { background: #3a4a7e; color: #fff; border-radius: 4px; padding: 6px 12px; margin: 6px 0 6px 8px; border-bottom: none; }
        .editor-tabs button.tab-extra:hover { background: #4a5a9e; color: #fff; }
        .editor-panel { flex: 1; overflow: hidden; display: none; }
        .editor-panel.active { display: flex; flex-direction: column; }
        .panel-container { flex: 1; overflow: hidden; min-height: 0; }
        .task-subtabs { display: flex; gap: 6px; padding: 8px 12px; background: #16213e; border-bottom: 1px solid #2a3a5e; }
        .task-subtabs button { padding: 6px 14px; border: 1px solid #2a3a5e; border-radius: 4px; background: #0f1830; color: #9ab; cursor: pointer; }
        .task-subtabs button.active { background: #2a3a6e; color: #fff; border-color: #4a5f9e; }
        .task-subview[hidden] { display: none !important; }
        #task-panel { display: flex; flex-direction: column; }
    </style>
</head>
<body>
    <div class="editor-app">
        <div id="editor-nav"></div>

        <div class="editor-main">
            <!-- 场景侧边栏 -->
            <div class="scene-sidebar">
                <div class="scene-sidebar-header">
                    <h3>场景列表</h3>
                    <div class="scene-filter">
                        <select id="scene-filter-type">
                            <option value="">全部类型</option>
                            <option value="normal">普通场景</option>
                            <option value="worldChunk">大地图块</option>
                            <option value="template">场景模板</option>
                        </select>
                        <select id="scene-filter-worldmap" style="display: none;"></select>
                    </div>
                </div>
                <div class="scene-list" id="scene-list"></div>
                <div class="scene-sidebar-footer">
                    <button id="new-scene-btn">+ 新建场景</button>
                    <button id="new-template-btn" title="新建场景模板">+ 模板</button>
                </div>
            </div>

            <!-- 主内容区：场景编辑器 + 触发器编辑器 标签切换 -->
            <div class="editor-content">
                <div class="editor-tabs">
                    <button class="active" data-tab="scene">🗺️ 场景编辑</button>
                    <button data-tab="trigger">⚡ 事件/触发器</button>
                    <button data-tab="behavior">🧩 行为编辑器</button>
                    <button data-tab="task">📋 任务图</button>
                    <button type="button" class="tab-extra" data-action="button-help" style="margin-left:auto;">⌨ 按钮写法</button>
                    <button type="button" class="tab-extra" data-action="item-reference">📦 物体写法</button>
                </div>

                <div class="editor-panel active" id="scene-panel">
                    <div class="panel-container" id="scene-editor-container"></div>
                </div>

                <div class="editor-panel" id="trigger-panel">
                    <div class="panel-container" id="trigger-editor-container"></div>
                </div>

                <div class="editor-panel" id="behavior-panel">
                    <div class="panel-container" id="behavior-editor-container"></div>
                </div>

                <div class="editor-panel" id="task-panel">
                    <div class="task-subtabs">
                        <button type="button" class="active" data-task-subtab="wizard">📋 任务向导</button>
                        <button type="button" data-task-subtab="graph">任务图（高级）</button>
                    </div>
                    <div class="panel-container task-subview" id="quest-wizard-container"></div>
                    <div class="panel-container task-subview" id="task-graph-editor-container" hidden></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { EditorPageContext, navigateTo, getQueryParams, renderEditorNav, openButtonHelp, openItemReferenceModal } from './EditorShared.js';
        import { SceneEditor } from './SceneEditor.js';
        import {
            activateGlobalAtlasesProject,
            getGlobalAtlasesConfig,
            loadGlobalAtlasesConfig,
            sceneDataLoader
        } from './SceneDataLoader.js';
        import { ProjectWorldIndex } from '../src/core/ProjectWorldIndex.js';
        import { TriggerEditor } from './TriggerEditor.js';
        import { BehaviorEditor } from './BehaviorEditor.js';
        import { TaskGraphEditor } from './TaskGraphEditor.js';
        import { QuestWizardEditor } from './QuestWizardEditor.js';

        (async () => {
            renderEditorNav('scene-workflow');
            const ctx = new EditorPageContext();
            await ctx.init();

            const { gameId, sceneId } = getQueryParams();
            if (!gameId) {
                alert('请先选择游戏');
                navigateTo('game-list');
                return;
            }

            // 填充游戏选择器
            const selector = document.getElementById('game-selector');
            const games = ctx.dataManager.getAllGames();
            selector.innerHTML = games.map(g => `<option value="${g.id}" ${g.id === gameId ? 'selected' : ''}>${g.name}</option>`).join('');
            selector.addEventListener('change', (e) => {
                navigateTo('scene-workflow', { gameId: e.target.value });
            });

            // 当前正在编辑的模板 id（编辑模板而非游戏场景时为非空）
            let editingTemplateId = null;

            // 渲染场景列表
            function renderSceneList() {
                const scenes = ctx.dataManager.getGameScenes(gameId);
                const list = document.getElementById('scene-list');
                const filter = document.getElementById('scene-filter-type').value;
                const worldMapFilter = document.getElementById('scene-filter-worldmap').value;

                // 「场景模板」筛选：列表只显示模板分组
                if (filter === 'template') {
                    list.innerHTML = buildTemplateSectionHtml();
                    bindTemplateItems();
                    return;
                }

                // 按 sceneType 筛选（场景使用 sceneType 区分，而非 type）
                let filtered = scenes;
                const wmSelect = document.getElementById('scene-filter-worldmap');
                if (filter === 'worldChunk') {
                    filtered = scenes.filter(s => s.sceneType === 'worldChunk');
                    if (worldMapFilter) filtered = filtered.filter(s => s.worldMap === worldMapFilter);
                    populateWorldMapFilter(filtered);
                    wmSelect.style.display = '';
                } else {
                    wmSelect.style.display = 'none';
                    if (filter === 'normal') filtered = scenes.filter(s => s.sceneType !== 'worldChunk');
                }

                const listHtml = filtered.map(s => `
                    <div class="scene-item ${s.id === ctx.currentSceneId ? 'active' : ''}" data-id="${s.id}">
                        <span>${s.name || s.id}</span>
                        <span class="scene-id">${s.id}</span>
                    </div>
                `).join('') || '<div style="padding: 20px; text-align: center; color: #666;">暂无场景</div>';

                // 末尾始终附上「场景模板」分组，方便直接查看/编辑模板
                list.innerHTML = listHtml + buildTemplateSectionHtml();

                list.querySelectorAll('.scene-item:not(.template-item)').forEach(item => {
                    item.addEventListener('click', async () => {
                        const sid = item.dataset.id;
                        const previousSceneId = ctx.currentSceneId;
                        const previousTemplateId = editingTemplateId;
                        const previousUrl = window.location.href;
                        editingTemplateId = null;
                        ctx.currentSceneId = sid;
                        // 更新 URL 但不刷新页面
                        const url = new URL(window.location);
                        url.searchParams.set('sceneId', sid);
                        window.history.replaceState({}, '', url);
                        const loaded = await loadSceneEditor(sid);
                        if (loaded === false) {
                            ctx.currentSceneId = previousSceneId;
                            editingTemplateId = previousTemplateId;
                            window.history.replaceState({}, '', previousUrl);
                        }
                        renderSceneList();
                    });
                });
                bindTemplateItems();
            }

            // 用当前筛选出的 worldChunk 场景填充「大地图」子筛选下拉
            function populateWorldMapFilter(worldChunkScenes) {
                const select = document.getElementById('scene-filter-worldmap');
                const value = select.value;
                const maps = [...new Set(worldChunkScenes.map(s => s.worldMap).filter(Boolean))];
                select.innerHTML = '<option value="">所有地图</option>' + maps.map(m =>
                    `<option value="${m}" ${m === value ? 'selected' : ''}>${m}</option>`).join('');
            }

            // 构建「场景模板」分组 HTML
            function buildTemplateSectionHtml() {
                const { templates } = ctx.dataManager.getSceneTemplates();
                const items = templates.map(t => `
                    <div class="scene-item template-item ${editingTemplateId === t.id ? 'active' : ''}" data-tpl-id="${t.id}" title="${t.description || ''}">
                        <span class="scene-name">📐 ${t.name}</span>
                        <div class="scene-actions">
                            <button data-tpl-action="edit" style="margin-right:6px;">编辑</button>
                            <button data-tpl-action="delete">×</button>
                        </div>
                    </div>
                `).join('');
                return `
                    <div class="scene-template-section" style="margin-top:10px;border-top:1px solid #3a3a3a;padding-top:6px;">
                        <div style="display:flex;align-items:center;justify-content:space-between;padding:4px 8px;color:#8bc34a;font-size:12px;font-weight:bold;">
                            <span>场景模板</span>
                            <button id="inline-add-template" title="新建模板" style="padding:0 6px;background:none;border:none;color:#8bc34a;cursor:pointer;font-size:14px;">＋</button>
                        </div>
                        ${items || '<div style="padding:8px;color:#666;font-size:12px;text-align:center;">暂无模板</div>'}
                    </div>`;
            }

            // 绑定模板项点击（编辑/删除）与「新建模板」按钮
            function bindTemplateItems() {
                document.querySelectorAll('#scene-list .template-item').forEach(item => {
                    item.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        const action = e.target.dataset.tplAction;
                        const id = item.dataset.tplId;
                        if (action === 'delete') await deleteTemplate(id);
                        else editSceneTemplate(id);
                    });
                });
                const addBtn = document.getElementById('inline-add-template');
                if (addBtn) addBtn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    await createNewTemplate();
                });
            }

            // 把模板配置写回 editor/config/scene-templates.json。模板不是游戏 canonical 文件，继续走 save-file。
            async function saveTemplatesToFile() {
                try {
                    // 请求载荷使用独立快照，避免等待网络期间后续内存修改串入本次提交。
                    const cfg = structuredClone(ctx.dataManager.getSceneTemplatesConfig());
                    const response = await fetch('/api/save-file', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ path: 'editor/config/scene-templates.json', content: JSON.stringify(cfg, null, 2) })
                    });
                    const result = await response.json().catch(() => ({}));
                    if (!response.ok || result?.ok !== true) {
                        const message = result.error || `模板保存 HTTP ${response.status}`;
                        console.warn('保存模板文件失败:', message);
                        return { ok: false, committed: false, status: 'failed', code: 'templateFileSaveFailed', error: message };
                    }
                    console.log('场景模板已保存到文件:', result.path);
                    return { ok: true, committed: true, status: 'committed', degraded: false, path: result.path };
                } catch (error) {
                    console.warn('保存模板文件请求失败:', error);
                    return {
                        ok: false,
                        committed: false,
                        status: 'failed',
                        code: 'templateFileSaveFailed',
                        error: error.message
                    };
                }
            }

            function persistenceError(result, fallback) {
                const firstError = result?.errors?.[0];
                const validationMessage = [firstError?.path, firstError?.message || firstError?.reason]
                    .filter(Boolean)
                    .join(': ');
                if (validationMessage) return validationMessage;
                if (typeof result?.error?.message === 'string') return result.error.message;
                if (typeof result?.error === 'string') return result.error;
                return fallback;
            }

            function showSceneEditorToast(message, type = 'error') {
                getSceneEditor().ui?.showToast?.(message, type);
            }

            function restoreTemplateSnapshot(snapshot, previousEditingTemplateId) {
                ctx.dataManager.replaceSceneTemplatesConfig(snapshot);
                editingTemplateId = previousEditingTemplateId;
                renderSceneList();
            }

            // 新建模板：克隆默认模板，文件提交成功后才进入编辑。
            async function createNewTemplate() {
                const name = prompt('输入新模板名称：', '新模板');
                if (!name) return;
                const snapshot = structuredClone(ctx.dataManager.getSceneTemplatesConfig());
                const previousEditingTemplateId = editingTemplateId;
                let template;
                try {
                    ({ template } = ctx.dataManager.createSceneTemplate({ name }));
                    const result = await saveTemplatesToFile();
                    if (result?.ok !== true || result.committed !== true) {
                        restoreTemplateSnapshot(snapshot, previousEditingTemplateId);
                        showSceneEditorToast('新建模板失败：' + persistenceError(result, '文件未提交'), 'error');
                        return;
                    }
                } catch (error) {
                    restoreTemplateSnapshot(snapshot, previousEditingTemplateId);
                    showSceneEditorToast('新建模板失败：' + error.message, 'error');
                    return;
                }
                editSceneTemplate(template.id);
            }

            // 删除模板：先准备内存草稿；文件提交失败时恢复完整配置和编辑态。
            async function deleteTemplate(templateId) {
                const tpl = ctx.dataManager.getSceneTemplate(templateId);
                if (!tpl) return;
                if (!confirm('确定删除模板「' + tpl.name + '」？')) return;
                const snapshot = structuredClone(ctx.dataManager.getSceneTemplatesConfig());
                const previousEditingTemplateId = editingTemplateId;
                try {
                    if (editingTemplateId === templateId) editingTemplateId = null;
                    ctx.dataManager.deleteSceneTemplate(templateId);
                    const result = await saveTemplatesToFile();
                    if (result?.ok !== true || result.committed !== true) {
                        restoreTemplateSnapshot(snapshot, previousEditingTemplateId);
                        showSceneEditorToast('删除模板失败：' + persistenceError(result, '文件未提交'), 'error');
                        return;
                    }
                } catch (error) {
                    restoreTemplateSnapshot(snapshot, previousEditingTemplateId);
                    showSceneEditorToast('删除模板失败：' + error.message, 'error');
                    return;
                }
                renderSceneList();
            }

            // 用场景编辑器打开模板的 scene 数据，保存时写回 scene-templates.json
            function editSceneTemplate(templateId) {
                const tpl = ctx.dataManager.getSceneTemplate(templateId);
                if (!tpl) return;
                editingTemplateId = templateId;
                ctx.currentSceneId = null;
                const editor = getSceneEditor();
                editor.loadScene(structuredClone(tpl.scene || {}));
                if (editor.ui && editor.ui.showToast) {
                    editor.ui.showToast('正在编辑模板「' + tpl.name + '」，保存将写回模板');
                }
                renderSceneList();
                window.dispatchEvent(new Event('resize'));
            }

        // 场景编辑器
        let sceneEditor = null;
        let sceneLoadGeneration = 0;

        // 场景正文 name 与 `_scene_order.json` 列表条目必须在同一事务中更新。
        async function handleSceneMetaChange(meta) {
            if (editingTemplateId) {
                if (meta.name === undefined) return { ok: false, committed: false, status: 'rejected', code: 'unsupportedTemplateMetaChange' };
                const templateId = editingTemplateId;
                const snapshot = structuredClone(ctx.dataManager.getSceneTemplatesConfig());
                const previousTemplate = structuredClone(ctx.dataManager.getSceneTemplate(templateId));
                try {
                    ctx.dataManager.updateSceneTemplateMeta(templateId, { name: meta.name });
                    const result = await saveTemplatesToFile();
                    if (result?.ok !== true || result.committed !== true) {
                        throw Object.assign(new Error(persistenceError(result, '模板名称文件未提交')), { result });
                    }
                    renderSceneList();
                    return result;
                } catch (error) {
                    ctx.dataManager.replaceSceneTemplatesConfig(snapshot);
                    const previousName = previousTemplate?.scene?.name ?? previousTemplate?.name ?? '';
                    if (sceneEditor?.sceneData) sceneEditor.sceneData.name = previousName;
                    const input = document.getElementById('editor-scene-name');
                    if (input) input.value = previousName;
                    renderSceneList();
                    const result = error.result || { ok: false, committed: false, status: 'failed', code: 'templateNameSaveFailed', error };
                    showSceneEditorToast('模板名称保存失败：' + persistenceError(result, error.message), 'error');
                    return result;
                }
            }

            const sceneId = ctx.currentSceneId;
            if (!sceneId) {
                const result = { ok: false, committed: false, status: 'rejected', code: 'missingSceneId', error: '未选择 canonical 场景' };
                showSceneEditorToast('名称保存失败：未选择 canonical 场景', 'error');
                return result;
            }

            const { service, projectPath } = ctx._sceneCommands();
            if (meta.id && meta.oldId) {
                let result;
                try {
                    result = await service.rename(projectPath, { oldId: meta.oldId, newId: meta.id });
                } catch (error) {
                    result = { ok: false, committed: false, status: 'failed', code: 'sceneRenameFailed', error };
                }
                if (result?.ok !== true || result.committed !== true) {
                    if (sceneEditor?.sceneData?.id === meta.id) sceneEditor.sceneData.id = meta.oldId;
                    const input = document.getElementById('editor-scene-id');
                    if (input) input.value = meta.oldId;
                    showSceneEditorToast('重命名失败：' + persistenceError(result, '磁盘未提交'), 'error');
                    return result;
                }

                ctx.currentSceneId = meta.id;
                if (sceneEditor?.sceneData) sceneEditor.sceneData.id = meta.id;
                const url = new URL(window.location);
                url.searchParams.set('sceneId', meta.id);
                window.history.replaceState({}, '', url);
                try {
                    await ctx.dataManager.initScenesFromFile(gameId);
                    renderSceneList();
                } catch (error) {
                    console.error('[SceneWorkflow] 场景已重命名，但列表刷新失败:', error);
                    showSceneEditorToast('场景已重命名，但列表刷新失败：' + error.message, 'warn');
                    return { ...result, degraded: true, refreshError: error };
                }
                if (result.degraded) showSceneEditorToast('重命名已提交，但缓存/通知同步降级', 'warn');
                return result;
            }

            if (meta.name !== undefined) {
                const previousListName = ctx.dataManager.getGameScenes(gameId).find(scene => scene.id === sceneId)?.name || sceneId;
                let result;
                try {
                    const model = ctx.documentService.requireProject(projectPath);
                    const scene = model.getCandidate().scenes[sceneId];
                    if (!scene) throw new Error(`canonical candidate 缺少场景 ${sceneId}`);
                    result = await service.update(projectPath, {
                        sceneId,
                        scene: { ...structuredClone(scene), name: meta.name },
                        orderEntry: { name: meta.name }
                    });
                } catch (error) {
                    result = { ok: false, committed: false, status: 'failed', code: 'sceneNameSaveFailed', error };
                }
                if (result?.ok !== true || result.committed !== true) {
                    if (sceneEditor?.sceneData) sceneEditor.sceneData.name = previousListName;
                    const input = document.getElementById('editor-scene-name');
                    if (input) input.value = previousListName;
                    showSceneEditorToast('名称保存失败：' + persistenceError(result, '磁盘未提交'), 'error');
                    return result;
                }

                try {
                    await ctx.dataManager.initScenesFromFile(gameId);
                    renderSceneList();
                } catch (error) {
                    console.error('[SceneWorkflow] 名称已提交，但列表刷新失败:', error);
                    showSceneEditorToast('名称已提交，但列表刷新失败：' + error.message, 'warn');
                    return { ...result, degraded: true, refreshError: error };
                }
                if (result.degraded) showSceneEditorToast('名称已提交，但缓存/通知同步降级', 'warn');
                return result;
            }

            return { ok: false, committed: false, status: 'rejected', code: 'unsupportedSceneMetaChange' };
        }

        // 惰性创建场景编辑器（供普通场景与模板共用），并处理模板编辑态的保存回写
        function getSceneEditor() {
            if (sceneEditor) return sceneEditor;
            sceneEditor = new SceneEditor(
                document.getElementById('scene-editor-container'),
                {
                    getSceneList: () => ctx.dataManager.getGameScenes(gameId),
                    getProjectDefinitions: () => ctx._projectDefinitions,
                    getProjectTriggers: () => ctx._projectDefinitions.triggers,
                    getBattleDefinitions: () => ctx._projectBattles,
                    getProjectPath: () => ctx._canonicalProjectPath(),
                    getSharedAtlasCatalog: projectPath => {
                        const catalog = getGlobalAtlasesConfig(projectPath);
                        return catalog ? structuredClone(catalog) : null;
                    },
                    saveSharedAtlasCatalog: (projectPath, catalog) => {
                        const { service } = ctx._sharedAtlasCommands();
                        return service.save(projectPath, catalog);
                    },
                    getContentLibrary: () => {
                        const model = ctx.documentService.requireProject(ctx._canonicalProjectPath());
                        return structuredClone(model.getCandidate().project?.library || {});
                    },
                    saveContentLibrary: async (library) => {
                        const projectPath = ctx._canonicalProjectPath();
                        const session = ctx._canonicalEditorSession('project');
                        /* 火堆内容库提交排障日志：
                        const expectedCampfirePresentation = structuredClone(
                            library?.items?.find(item => item?.id === 'story.s01.campfire')?.campfirePresentation?.presentation || null
                        );
                        console.info('[SceneWorkflow][ContentLibrarySave] patch-before', {
                            projectPath,
                            expectedCampfirePresentation,
                            candidateBefore: ctx.documentService.requireProject(projectPath)
                                .getCandidate().project?.library?.items
                                ?.find(item => item?.id === 'story.s01.campfire')?.campfirePresentation?.presentation || null
                        });
                        */
                        session.patch('library', structuredClone(library));
                        /* 火堆内容库提交排障日志：
                        console.info('[SceneWorkflow][ContentLibrarySave] patch-after', {
                            projectPath,
                            candidateAfter: session.model.getCandidate().project?.library?.items
                                ?.find(item => item?.id === 'story.s01.campfire')?.campfirePresentation?.presentation || null
                        });
                        */
                        const result = await session.save();
                        /* 火堆内容库提交排障日志：
                        console.info('[SceneWorkflow][ContentLibrarySave] session-save-result', {
                            projectPath,
                            ok: result?.ok,
                            committed: result?.committed,
                            code: result?.code,
                            transactionId: result?.transactionId,
                            changes: result?.changes?.map(change => ({ operation: change.operation, path: change.path }))
                        });
                        */
                        if (result?.ok !== true || result.committed !== true) return result;
                        try {
                            const project = await ctx._readCanonicalJson(projectPath);
                            /* 火堆内容库提交排障日志：
                            console.info('[SceneWorkflow][ContentLibrarySave] disk-readback', {
                                projectPath,
                                expectedCampfirePresentation,
                                committedCampfirePresentation: project.library?.items
                                    ?.find(item => item?.id === 'story.s01.campfire')?.campfirePresentation?.presentation || null
                            });
                            */
                            session.acceptExternalProjectCommit(project, {
                                snapshotRevision: result.snapshotRevision
                            });
                            return { ...result, project, library: structuredClone(project.library || {}) };
                        } catch (error) {
                            console.error('[SceneWorkflow] 内容库提交后磁盘回读失败', error);
                            return {
                                ...result,
                                ok: false,
                                code: 'contentLibraryReadbackFailed',
                                error
                            };
                        }
                    },
                    presentationProfile: ctx._presentationProfile,
                    onSceneMetaChange: handleSceneMetaChange,
                    onSceneChange: async (data) => {
                        // 模板编辑态：写回非 canonical 的 scene-templates.json。
                        if (editingTemplateId) {
                            const templateId = editingTemplateId;
                            const snapshot = structuredClone(ctx.dataManager.getSceneTemplatesConfig());
                            try {
                                ctx.dataManager.upsertSceneTemplate(templateId, data);
                                const result = await saveTemplatesToFile();
                                if (result?.ok !== true || result.committed !== true) {
                                    throw Object.assign(
                                        new Error(persistenceError(result, '保存场景模板失败')),
                                        { result }
                                    );
                                }
                                return {
                                    ...result,
                                    successMessage: `模板「${ctx.dataManager.getSceneTemplate(templateId)?.name || templateId}」已保存`
                                };
                            } catch (error) {
                                // upsert、请求或结果校验任一步失败都恢复完整共享配置快照。
                                ctx.dataManager.replaceSceneTemplatesConfig(snapshot);
                                throw error;
                            }
                        }

                        // 普通场景只通过 canonical command service 提交；cache/HMR 由服务在磁盘 commit 后同步。
                        const sceneId = ctx.currentSceneId;
                        if (!sceneId) throw new Error('未选择要保存的 canonical 场景');
                        const { service, projectPath } = ctx._sceneCommands();
                        const result = await service.save(projectPath, {
                            sceneId,
                            sourceUri: `${projectPath.slice(0, -'/game.project.json'.length)}/assets/scenes/${sceneId}.json`,
                            scene: structuredClone(data)
                        });
                        if (result?.ok !== true || result.committed !== true) {
                            const firstError = result?.errors?.[0];
                            const detail = [firstError?.path, firstError?.message || firstError?.reason]
                                .filter(Boolean)
                                .join(': ');
                            const message = detail || result?.error?.message || result?.error || '保存 canonical 场景失败';
                            throw Object.assign(new Error(message), { result });
                        }
                        return result;
                    },
                    openTriggerEditor: async (definitionId, target = 'triggers') => {
                        await switchTab('trigger');
                        if (triggerEditor && definitionId) {
                            triggerEditor.selectById?.(definitionId, target);
                        }
                    }
                }
            );
            return sceneEditor;
        }

        function isSceneLoadCurrent(ownerSceneId, loadGeneration) {
            return loadGeneration === sceneLoadGeneration && ctx.currentSceneId === ownerSceneId;
        }

        function getCanonicalScenePath(sceneIdToLoad) {
            const projectPath = ctx._canonicalProjectPath();
            const rootEnd = projectPath.lastIndexOf('/') + 1;
            return `${projectPath.slice(0, rootEnd)}assets/scenes/${sceneIdToLoad}.json`;
        }

        function mergeRenderableSceneDocuments(presetScene, savedScene) {
            if (presetScene && savedScene) {
                const merged = {
                    ...presetScene,
                    ...savedScene,
                    terrain: savedScene.terrain || presetScene.terrain,
                    decoSprites: savedScene.decoSprites || presetScene.decoSprites,
                    decorations: (savedScene.decorations && savedScene.decorations.length)
                        ? savedScene.decorations
                        : presetScene.decorations,
                    centerX: savedScene.centerX ?? presetScene.centerX,
                    centerY: savedScene.centerY ?? presetScene.centerY,
                    basinRadius: savedScene.basinRadius ?? presetScene.basinRadius,
                    basinAspectY: savedScene.basinAspectY ?? presetScene.basinAspectY
                };
                if (!Object.prototype.hasOwnProperty.call(savedScene, 'atlases')) delete merged.atlases;
                return merged;
            }
            return savedScene || presetScene || null;
        }

        // 当前场景和九宫格邻居共用同一正文读取链：磁盘 canonical → committed snapshot → preset。
        async function loadRenderableSceneDocument(documentSceneId, ownerSceneId, loadGeneration) {
            let presetScene = null;
            try {
                presetScene = await sceneDataLoader.loadScene(documentSceneId);
            } catch (error) {
                if (!isSceneLoadCurrent(ownerSceneId, loadGeneration)) return { status: 'stale', sceneData: null };
                console.warn(`[SceneWorkflow] 加载场景 ${documentSceneId} 的 preset 失败:`, error);
            }
            if (!isSceneLoadCurrent(ownerSceneId, loadGeneration)) return { status: 'stale', sceneData: null };

            let fileScene = null;
            try {
                const parsed = await ctx._readCanonicalJson(getCanonicalScenePath(documentSceneId));
                if (!isSceneLoadCurrent(ownerSceneId, loadGeneration)) return { status: 'stale', sceneData: null };
                fileScene = Array.isArray(parsed?.layers) ? parsed : null;
                if (parsed && !fileScene) {
                    console.warn(`[SceneWorkflow] 场景 ${documentSceneId} 的磁盘文档缺少有效 layers`);
                }
            } catch (error) {
                if (!isSceneLoadCurrent(ownerSceneId, loadGeneration)) return { status: 'stale', sceneData: null };
                console.warn(`[SceneWorkflow] 加载场景 ${documentSceneId} 的磁盘文档失败:`, error);
            }

            let savedScene = fileScene;
            if (!savedScene) {
                try {
                    const committed = ctx.documentService
                        .requireProject(ctx._canonicalProjectPath())
                        .getCommittedSnapshot().scenes[documentSceneId];
                    savedScene = Array.isArray(committed?.layers) ? committed : null;
                } catch (error) {
                    savedScene = null;
                }
            }

            const sceneData = mergeRenderableSceneDocuments(presetScene, savedScene);
            return Array.isArray(sceneData?.layers)
                ? { status: 'ready', sceneData }
                : { status: 'missing', sceneData: null };
        }

        async function prepareSceneWorldProjection(sid, loadGeneration, editor) {
            if (!isSceneLoadCurrent(sid, loadGeneration)) return null;
            editor.setNeighborScenes([]);
            editor.setWorldMapLocation(null);

            let worldIndex;
            try {
                const candidate = ctx.documentService
                    .requireProject(ctx._canonicalProjectPath())
                    .getCandidate();
                worldIndex = ProjectWorldIndex.build(candidate?.project, {
                    requireSceneDimensions: true
                });
            } catch (error) {
                if (!isSceneLoadCurrent(sid, loadGeneration)) return null;
                const detail = error?.errors?.[0]?.message || error.message;
                const message = `无法读取场景 ${sid} 的 canonical 世界索引，不能计算大地图位置和相邻场景`;
                console.error(`[SceneWorkflow] ${message}:`, error);
                showSceneEditorToast(`${message}：${detail}`, 'error');
                return false;
            }
            if (!isSceneLoadCurrent(sid, loadGeneration)) return null;

            const currentAnchor = worldIndex.findScene(sid);
            if (!currentAnchor?.loadable) {
                const message = `场景 ${sid} 未定位到可加载的 canonical 世界格`;
                console.warn(`[SceneWorkflow] ${message}`);
                showSceneEditorToast(message, 'warn');
                return false;
            }

            const region = worldIndex.getRegion(currentAnchor.regionId);
            editor.setWorldMapLocation({
                regionId: currentAnchor.regionId,
                regionName: region?.name || '',
                row: currentAnchor.row,
                col: currentAnchor.col
            });

            const adjacentAnchors = worldIndex.getAdjacentSceneAnchors(sid);
            const preparedNeighbors = await Promise.all(adjacentAnchors.map(async neighborAnchor => ({
                neighborAnchor,
                document: await loadRenderableSceneDocument(neighborAnchor.sceneId, sid, loadGeneration)
            })));
            if (!isSceneLoadCurrent(sid, loadGeneration)
                || preparedNeighbors.some(entry => entry.document.status === 'stale')) {
                return null;
            }

            const missingSceneIds = preparedNeighbors
                .filter(entry => entry.document.status !== 'ready')
                .map(entry => entry.neighborAnchor.sceneId);
            if (missingSceneIds.length > 0) {
                const message = `九宫格邻居 ${missingSceneIds.join(', ')} 缺少可渲染的 canonical 场景文档`;
                console.error(`[SceneWorkflow] ${message}`);
                showSceneEditorToast(message, 'error');
                return false;
            }

            editor.setNeighborScenes(preparedNeighbors.map(({ neighborAnchor, document }) => ({
                sceneData: document.sceneData,
                offsetX: neighborAnchor.offset.x - currentAnchor.offset.x,
                offsetY: neighborAnchor.offset.y - currentAnchor.offset.y
            })));
            return true;
        }

        async function loadSceneEditor(sid) {
            const loadGeneration = ++sceneLoadGeneration;
            const atlasProjectPath = ctx._canonicalProjectPath();
            activateGlobalAtlasesProject(atlasProjectPath);
            sceneEditor?.activateSharedAtlasProject(atlasProjectPath);
            try {
                await loadGlobalAtlasesConfig(atlasProjectPath);
            } catch (error) {
                if (!isSceneLoadCurrent(sid, loadGeneration)) return null;
                console.error('[SceneWorkflow] 加载共享图集 catalog 失败:', error);
                showSceneEditorToast(`加载共享图集失败：${error.message}`, 'error');
                return false;
            }
            if (!isSceneLoadCurrent(sid, loadGeneration)) return null;

            const loadedDocument = await loadRenderableSceneDocument(sid, sid, loadGeneration);
            if (loadedDocument.status === 'stale') return null;
            if (loadedDocument.status !== 'ready') {
                const message = `无法加载场景 ${sid}：磁盘 canonical 文档、已提交快照与已登记 preset 均不存在有效 layers`;
                console.error('[SceneWorkflow]', message);
                showSceneEditorToast(message, 'error');
                return false;
            }

            let editor;
            try {
                editingTemplateId = null;
                editor = getSceneEditor();
                editor.loadScene(loadedDocument.sceneData);
                editor.refreshTriggerReferences?.();
            } catch (error) {
                console.error(`[SceneWorkflow] 加载场景 ${sid} 失败:`, error);
                showSceneEditorToast(`加载场景 ${sid} 失败：${error.message}`, 'error');
                return false;
            }

            try {
                const projectionResult = await prepareSceneWorldProjection(sid, loadGeneration, editor);
                if (projectionResult === null) return null;
            } catch (error) {
                if (!isSceneLoadCurrent(sid, loadGeneration)) return null;
                console.error(`[SceneWorkflow] 准备场景 ${sid} 的九宫格参考失败:`, error);
                showSceneEditorToast(`场景已加载，但九宫格参考准备失败：${error.message}`, 'error');
            }
            return true;
        }

        // 事件/触发器编辑器
        let triggerEditor = null;
        let triggerEditorInitPromise = null;
        async function loadTriggerEditor() {
            if (triggerEditorInitPromise) return triggerEditorInitPromise;
            triggerEditor = new TriggerEditor(
                document.getElementById('trigger-editor-container'),
                {
                    gameId: gameId,
                    canonicalSession: ctx._canonicalEditorSession('project'),
                    getSceneList: () => ctx.dataManager.getGameScenes(gameId),
                    getSceneDocuments: () => ctx.getSceneDocuments(),
                    getPlacementOptions: () => ctx.getPlacementOptions(sceneEditor),
                    onSaved: project => ctx._refreshProjectTriggers(project)
                }
            );
            triggerEditorInitPromise = triggerEditor.init()
                .then(() => triggerEditor)
                .catch(error => {
                    triggerEditor = null;
                    triggerEditorInitPromise = null;
                    throw error;
                });
            return triggerEditorInitPromise;
        }

        // 行为编辑器：管理 project.triggerCatalog.actions[]，与事件/触发器共用 canonical session。
        let behaviorEditor = null;
        let behaviorEditorInitPromise = null;
        async function loadBehaviorEditor() {
            if (behaviorEditorInitPromise) return behaviorEditorInitPromise;
            behaviorEditor = new BehaviorEditor(
                document.getElementById('behavior-editor-container'),
                {
                    canonicalSession: ctx._canonicalEditorSession('project'),
                    getSceneList: () => ctx.dataManager.getGameScenes(gameId),
                    getSceneDocuments: () => ctx.getSceneDocuments(),
                    projectPath: ctx._canonicalProjectPath(),
                    onSaved: async project => {
                        ctx._refreshProjectTriggers(project);
                        await triggerEditor?.refresh?.();
                        sceneEditor?.refreshTriggerReferences?.();
                    }
                }
            );
            behaviorEditorInitPromise = behaviorEditor.init()
                .then(() => behaviorEditor)
                .catch(error => {
                    behaviorEditor = null;
                    behaviorEditorInitPromise = null;
                    throw error;
                });
            return behaviorEditorInitPromise;
        }

        // 任务中心：任务向导（quests[]，Quest v2 五区块）+ 任务图高级视图（taskGraphs[]），共用 canonical session。
        let questWizardEditor = null;
        let questWizardEditorInitPromise = null;
        async function loadQuestWizardEditor() {
            if (questWizardEditorInitPromise) return questWizardEditorInitPromise;
            questWizardEditor = new QuestWizardEditor(
                document.getElementById('quest-wizard-container'),
                {
                    canonicalSession: ctx._canonicalEditorSession('project'),
                    projectPath: ctx._canonicalProjectPath(),
                    getSceneList: () => ctx.dataManager.getGameScenes(gameId),
                    getSceneDocuments: () => ctx.getSceneDocuments()
                }
            );
            questWizardEditorInitPromise = questWizardEditor.init()
                .then(() => questWizardEditor)
                .catch(error => {
                    questWizardEditor = null;
                    questWizardEditorInitPromise = null;
                    throw error;
                });
            return questWizardEditorInitPromise;
        }

        let taskGraphEditor = null;
        let taskGraphEditorInitPromise = null;
        async function loadTaskGraphEditor() {
            if (taskGraphEditorInitPromise) return taskGraphEditorInitPromise;
            taskGraphEditor = new TaskGraphEditor(
                document.getElementById('task-graph-editor-container'),
                {
                    canonicalSession: ctx._canonicalEditorSession('project'),
                    projectPath: ctx._canonicalProjectPath(),
                    getSceneList: () => ctx.dataManager.getGameScenes(gameId),
                    getSceneDocuments: () => ctx.getSceneDocuments()
                }
            );
            taskGraphEditorInitPromise = taskGraphEditor.init()
                .then(() => taskGraphEditor)
                .catch(error => {
                    taskGraphEditor = null;
                    taskGraphEditorInitPromise = null;
                    throw error;
                });
            return taskGraphEditorInitPromise;
        }

        // 任务子视图切换：向导（quests 编译运行时产物）为默认；任务图仅编辑未迁移的手写定义。
        let activeTaskSubtab = 'wizard';
        async function switchTaskSubtab(subtab) {
            activeTaskSubtab = subtab;
            document.querySelectorAll('.task-subtabs button[data-task-subtab]').forEach(b => b.classList.toggle('active', b.dataset.taskSubtab === subtab));
            document.getElementById('quest-wizard-container').hidden = subtab !== 'wizard';
            document.getElementById('task-graph-editor-container').hidden = subtab !== 'graph';
            if (subtab === 'wizard') await loadQuestWizardEditor();
            else await loadTaskGraphEditor();
        }
        document.querySelectorAll('.task-subtabs button[data-task-subtab]').forEach(btn => {
            btn.addEventListener('click', () => { switchTaskSubtab(btn.dataset.taskSubtab).catch(console.error); });
        });

        // 标签切换
        async function switchTab(tab) {
            const panels = ['scene', 'trigger', 'behavior', 'task'];
            document.querySelectorAll('.editor-tabs button[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
            for (const panel of panels) document.getElementById(`${panel}-panel`).classList.toggle('active', tab === panel);
            if (tab === 'trigger') await loadTriggerEditor();
            if (tab === 'behavior') await loadBehaviorEditor();
            if (tab === 'task') await switchTaskSubtab(activeTaskSubtab);
            if (tab === 'scene') setTimeout(() => window.dispatchEvent(new Event('resize')), 50);
        }

        // 标签切换（仅绑定标签页按钮；「按钮写法/物体写法」是弹层入口，不参与切换）
        document.querySelectorAll('.editor-tabs button[data-tab]').forEach(btn => {
            btn.addEventListener('click', async () => {
                await switchTab(btn.dataset.tab);
            });
        });

        // 「按钮写法 / 物体写法」弹层（位于「⚡ 事件/触发器」之后，弹出窗口而非跳转页面）
        document.querySelector('.editor-tabs [data-action="button-help"]')?.addEventListener('click', () => openButtonHelp({ gameId }));
        document.querySelector('.editor-tabs [data-action="item-reference"]')?.addEventListener('click', () => openItemReferenceModal({ gameId }));

        // 筛选器
        document.getElementById('scene-filter-type').addEventListener('change', renderSceneList);

        // 新建 canonical 场景：只通过 command service 提交；磁盘提交后再刷新列表缓存和编辑器。
        document.getElementById('new-scene-btn').addEventListener('click', async () => {
            const name = prompt('场景名称：')?.trim();
            if (!name) return;
            const id = prompt('场景ID（英文）：')?.trim();
            if (!id) return;

            const draft = ctx.dataManager.createSceneDraft({ id, name });
            let result;
            try {
                const { service, projectPath } = ctx._sceneCommands();
                result = await service.create(projectPath, { scene: draft });
            } catch (error) {
                console.error('新建 canonical 场景请求失败:', error);
                showSceneEditorToast('新建场景失败：' + error.message, 'error');
                return;
            }

            if (result?.ok !== true || result.committed !== true) {
                showSceneEditorToast('新建场景失败：' + persistenceError(result, '磁盘未提交'), 'error');
                return;
            }

            const previousSceneId = ctx.currentSceneId;
            const previousUrl = window.location.href;
            ctx.currentSceneId = id;
            const url = new URL(window.location);
            url.searchParams.set('sceneId', id);
            window.history.replaceState({}, '', url);
            try {
                await ctx.dataManager.initScenesFromFile(gameId);
                const loaded = await loadSceneEditor(id);
                if (loaded === false) {
                    ctx.currentSceneId = previousSceneId;
                    window.history.replaceState({}, '', previousUrl);
                    renderSceneList();
                    showSceneEditorToast('场景已写入磁盘，但编辑器无法加载该 canonical 文档', 'warn');
                    return;
                }
                renderSceneList();
            } catch (error) {
                ctx.currentSceneId = previousSceneId;
                window.history.replaceState({}, '', previousUrl);
                console.error('场景已创建，但编辑器刷新失败:', error);
                showSceneEditorToast('场景已写入磁盘，但编辑器刷新失败：' + error.message, 'warn');
                return;
            }

            showSceneEditorToast(
                result.degraded ? '场景已写入磁盘，但缓存/通知同步降级' : `场景「${name}」已创建`,
                result.degraded ? 'warn' : 'success'
            );
        });

        async function loadInitialScene() {
            const scenes = ctx.dataManager.getGameScenes(gameId);
            const requestedScene = scenes.find(scene => scene.id === sceneId) || null;
            const candidates = requestedScene
                ? [requestedScene, ...scenes.filter(scene => scene.id !== requestedScene.id)]
                : scenes;

            for (const scene of candidates) {
                ctx.currentSceneId = scene.id;
                const loaded = await loadSceneEditor(scene.id);
                if (loaded === true) {
                    const url = new URL(window.location);
                    url.searchParams.set('sceneId', scene.id);
                    window.history.replaceState({}, '', url);
                    renderSceneList();
                    return true;
                }
                // latest-wins：已有较新的场景加载请求时，不得覆盖它的当前选择。
                if (loaded === null) return null;
            }

            ctx.currentSceneId = null;
            renderSceneList();
            return false;
        }

        // 初始化
        renderSceneList();
        await loadInitialScene();

        // 场景模板筛选
        document.getElementById('new-template-btn').addEventListener('click', async () => {
            await createNewTemplate();
        });

        })().catch(error => {
            console.error('[SceneWorkflow] 初始化失败', error);
            const container = document.getElementById('scene-editor-container');
            if (container) container.textContent = `场景编辑器初始化失败：${error?.message || String(error)}`;
        });
    </script>
</body>
</html>
