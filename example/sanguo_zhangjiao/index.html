        // 登录层不依赖活动场景，但复用正式 GamepadManager、Xbox360Profile 与项目绑定配置。
        let menuPadArmed = false;
        let menuPadDirection = 0;
        let menuPadIndex = 0;
        let loginGamepadManager = null;
        let loginGamepadRafId = null;
        let loginGamepadGeneration = 0;
        let loginGamepadPollingRequested = false;
        let loginGamepadInitPromise = null;
        let loginGamepadActionButtons = { confirm: [], cancel: [], settings: [] };

        function refreshLoginGamepadActionButtons() {
            const bindings = loginGamepadManager?.getBindings?.() || {};
            const findButtons = action => Object.entries(bindings)
                .filter(([, boundAction]) => boundAction === action)
                .map(([index]) => Number(index))
                .filter(Number.isInteger);
            loginGamepadActionButtons = {
                confirm: findButtons('e'),
                cancel: findButtons('escape'),
                settings: findButtons(SETTINGS_ACTION)
            };
        }

        function resetLoginGamepadNavigation() {
            menuPadArmed = false;
            menuPadDirection = 0;
        }

        function isAnyMenuButtonDown(indices) {
            return indices.some(index => loginGamepadManager?.isButtonDown(index));
        }

        function isAnyMenuButtonPressed(indices) {
            return indices.some(index => loginGamepadManager?.isButtonPressed(index));
        }

        function scheduleLoginGamepadPoll() {
            if (!loginGamepadPollingRequested || !loginGamepadManager || loginGamepadRafId !== null) return;
            const generation = loginGamepadGeneration;
            loginGamepadRafId = requestAnimationFrame(() => pollLoginGamepad(generation));
        }

        function pollLoginGamepad(generation) {
            loginGamepadRafId = null;
            if (generation !== loginGamepadGeneration || !loginGamepadPollingRequested || !loginGamepadManager) return;

            const connected = loginGamepadManager.poll();
            if (!loginScreen.classList.contains('hidden') && connected) {
                const move = loginGamepadManager.getMoveVector();
                const direction = move.y < 0 ? -1 : (move.y > 0 ? 1 : 0);
                const confirmDown = isAnyMenuButtonDown(loginGamepadActionButtons.confirm);
                const cancelDown = loginGamepadManager.isButtonDown(PadButton.B)
                    || isAnyMenuButtonDown(loginGamepadActionButtons.cancel)
                    || isAnyMenuButtonDown(loginGamepadActionButtons.settings);
                const isConfirmingOverwrite = isOverwriteConfirmationOpen();
                const isEditingProfile = !isConfirmingOverwrite && isNewGameProfileOpen();
                const isPickingSave = !isConfirmingOverwrite && saveSlotsElement.classList.contains('visible');
                const active = isConfirmingOverwrite
                    ? [overwriteConfirmAccept, overwriteConfirmCancel]
                    : isPickingSave
                        ? [saveSlotConfirm]
                        : isEditingProfile
                            ? [newGameProfileConfirm, newGameProfileCancel]
                            : Array.from(loginScreen.querySelectorAll('.login-action'))
                                .filter(button => button.offsetParent !== null && !button.disabled);

                if (!menuPadArmed) {
                    menuPadArmed = !confirmDown && !cancelDown && direction === 0;
                } else {
                    if (active.length > 0) menuPadIndex = Math.min(menuPadIndex, active.length - 1);
                    else menuPadIndex = 0;

                    if (isPickingSave && direction && direction !== menuPadDirection) {
                        const options = savePickerEntries.filter(entry => !entry.disabled);
                        if (options.length > 0) {
                            const currentIndex = options.findIndex(entry => entry.value === selectedSaveValue);
                            const baseIndex = currentIndex >= 0 ? currentIndex : 0;
                            const nextIndex = (baseIndex + direction + options.length) % options.length;
                            selectSaveEntry(options[nextIndex]?.value);
                        }
                    } else if (!isPickingSave && direction && direction !== menuPadDirection && active.length) {
                        menuPadIndex = (menuPadIndex + direction + active.length) % active.length;
                        active[menuPadIndex].focus();
                    }

                    if (isAnyMenuButtonPressed(loginGamepadActionButtons.confirm)) {
                        if (isConfirmingOverwrite) active[menuPadIndex]?.click();
                        else if (isPickingSave) void confirmSavePicker();
                        else active[menuPadIndex]?.click();
                    }

                    const cancelPressed = loginGamepadManager.isButtonPressed(PadButton.B)
                        || isAnyMenuButtonPressed(loginGamepadActionButtons.cancel)
                        || isAnyMenuButtonPressed(loginGamepadActionButtons.settings);
                    if (cancelPressed) {
                        if (isConfirmingOverwrite) settleOverwriteConfirmation(false);
                        else if (isPickingSave) closeSavePicker();
                        else if (isEditingProfile) closeNewGameProfile();
                        else if (loginScreen.classList.contains('in-game')) closeSystemMenu();
                    }
                }
                menuPadDirection = direction;
            } else {
                resetLoginGamepadNavigation();
            }
            scheduleLoginGamepadPoll();
        }

        async function initializeLoginGamepad() {
            if (loginGamepadManager) return loginGamepadManager;
            if (loginGamepadInitPromise) return loginGamepadInitPromise;
            const generation = loginGamepadGeneration;
            const manager = new GamepadManager();
            const pending = (async () => {
                try {
                    const response = await fetch('./config/gamepad.json');
                    if (response.ok) manager.applyConfig(await response.json());
                    else console.warn('登录页手柄配置加载失败', { status: response.status });
                } catch (error) {
                    console.warn('登录页手柄配置加载失败，沿用框架默认绑定', error);
                }
                if (generation !== loginGamepadGeneration) {
                    manager.destroy();
                    return null;
                }
                loginGamepadManager = manager;
                refreshLoginGamepadActionButtons();
                scheduleLoginGamepadPoll();
                return manager;
            })();
            loginGamepadInitPromise = pending;
            try {
                return await pending;
            } finally {
                if (loginGamepadInitPromise === pending) loginGamepadInitPromise = null;
            }
        }

        function resumeLoginGamepadPolling() {
            loginGamepadPollingRequested = true;
            if (!loginGamepadManager) void initializeLoginGamepad();
            else scheduleLoginGamepadPoll();
        }

        function pauseLoginGamepadPolling() {
            loginGamepadPollingRequested = false;
            if (loginGamepadRafId !== null) cancelAnimationFrame(loginGamepadRafId);
            loginGamepadRafId = null;
            resetLoginGamepadNavigation();
        }

        function destroyLoginGamepad() {
            loginGamepadGeneration += 1;
            pauseLoginGamepadPolling();
            loginGamepadManager?.destroy();
            loginGamepadManager = null;
            loginGamepadActionButtons = { confirm: [], cancel: [], settings: [] };
        }

        // 初始化游戏
        async function initGame(options = {}) {
            lastRenderedSavePreview = null;
            savePreviewCaptureGeneration++;
            savePreviewCaptureInFlight = null;
            renderedPreviewWaiters.clear();
            try {
                // 项目配置已在登录页阶段读取；加载页复用同一份配置。
                const project = await loadProjectConfig();

                    if (h1 && loadingConfig.titleColor) h1.style.color = loadingConfig.titleColor;
                    if (ls && loadingConfig.backgroundColor) ls.style.background = loadingConfig.backgroundColor;
                    if (loadingConfig.progressBarColor) {

                        if (pf) pf.style.background = `linear-gradient(90deg, ${loadingConfig.progressBarColor})`;
                    }
                    if (loadingConfig.icon) {

                        let iconEl = document.getElementById('loading-icon');

                            iconEl.alt = 'logo';

                    if (loadingConfig.loadingText) {
                        loadingText.textContent = loadingConfig.loadingText;
                    }
                }

                // 按配置的步骤加载，或使用默认步骤
                const steps = loadingConfig?.steps || [
                    { progress: 0, text: '初始化 ECS 系统...', delay: 500 },
                    { progress: 25, text: '加载核心系统...', delay: 500 },
                    { progress: 50, text: '创建场景管理器...', delay: 300 },
                    { progress: 60, text: '注册场景...', delay: 500 },
                    { progress: 75, text: '初始化玩家实体...', delay: 0 },
                    { progress: 90, text: '进入 S01...', delay: 500 },
                    { progress: 100, text: '完成！', delay: 500 }
                ];
                let stepIndex = 0;
                const nextStep = async () => {
                    if (stepIndex < steps.length) {
                        const s = steps[stepIndex];
                        updateLoading(s.progress, s.text);
                        if (s.delay > 0) await sleep(s.delay);
                        stepIndex++;
                    }
                };

                // 模拟加载过程（按步骤推进）
                await nextStep(); // 步骤 0

                await nextStep(); // 步骤 1
                // 创建并初始化 AssetManager
                detachAssetLoadProgress?.();
                detachAssetLoadProgress = null;
                assetManager = new AssetManager();
                assetManager.setAssetBasePath('assets/');
                detachAssetLoadProgress = assetManager.onLoadProgress(({ completed, total }) => {
                    if (total <= 0) return;
                    const progress = Math.min(100, Math.max(0, (completed / total) * 100));
                    updateLoading(progress, `资源加载中... ${completed}/${total}`);
                });
                assetManager.loadPlaceholderAssets();

                await nextStep(); // 步骤 2
                sceneManager = new SceneManager();
                sceneManager.setRenderSize(displayScaler.logicalWidth, displayScaler.logicalHeight);

                await nextStep(); // 步骤 3
                notificationSystem = new NotificationSystem({ x: 10, y: 100, maxNotifications: 5 });
                scene = null;

                await nextStep(); // 步骤 4

                await nextStep(); // 步骤 5
                // 正式运行只注册唯一的大地图场景；编辑器也读取相同 canonical 磁盘数据。
                const dd = new DataDrivenPrologueScene();
                dd.assetManager = assetManager;
                dd.audioManager = assetManager.getAudioManager();
                // 启动意图必须在 enter() 前写入，避免世界加载过快时新档/读档竞态。
                dd.setProgressionBootstrap?.({ isNewGame: !options.loadSave });
                sceneManager.registerScene('DataDrivenPrologueScene', dd);
                dd.setSceneManager(sceneManager);
                dd.setSaveGameService(saveGames);
                scene = dd;
                sceneManager.switchTo('DataDrivenPrologueScene');
                
                if (scene) {
                    setupSceneCallbacks(scene);
                    scene.setSystemMenuCallback?.(() => openSystemMenu());

                    // 启动必须等待世界和 GameLoader 成功；任何失败都不能进入可运行或可写档状态。
                    const readyTasks = [
                        scene._worldLoadPromise,
                        scene._gameLoaderReady,
                        scene._worldRuntimeReadyPromise
                    ].filter(Boolean);
                    if (readyTasks.length) await Promise.all(readyTasks);
                    saveGames.setStateProvider({
                        capture: () => scene.captureSaveState(),
                        validate: data => scene.validateSaveState(data),
                        restore: data => scene.restoreSaveState(data)
                    });
                    const selection = options.saveSelection || { kind: 'manual', index: activeSaveSlot };
                    if (selection.kind === 'manual') activeSaveSlot = selection.index;
                    if (options.loadSave) {
                        const inspected = selection.kind === 'auto'
                            ? saveGames.inspectAuto(selection.index)
                            : saveGames.inspect(selection.index);
                        if (inspected.ok) {
                            const savedState = inspected.snapshot?.data?.game;
                            const prepared = await scene.prepareRestoreRegion?.(savedState);
                            if (prepared?.ok === false) {
                                throw new Error(prepared.errors?.[0]?.message || '无法准备存档所在区域');
                            }
                        }
                        const loaded = selection.kind === 'auto'
                            ? saveGames.loadAuto(selection.index)
                            : saveGames.load(selection.index);
                        if (!loaded.ok) {
                            console.warn('读取存档失败', loaded.errors);
                            const incompatible = loaded.errors?.some(error => error.code === 'incompatibleSave');
                            const message = incompatible
                                ? '版本不兼容，请开始新游戏'
                                : (loaded.errors?.[0]?.message || '存档读取失败，存档数据可能已损坏。');
                            throw new Error(message);
                        }
                    } else {
                        // 新游戏只清理所选手动栏位，绝不影响自动存档位。
                        saveGames.clear(activeSaveSlot);
                    }
                }
                
                await nextStep(); // 步骤 6（完成）
                gameStarted = true;

                // 先启动唯一游戏循环，等待首个完整渲染帧后才创建新游戏初始存档，避免透明 Canvas 被 JPEG 编码为黑图。
                startGameLoop();
                if (!options.loadSave) {
                    await waitForRenderedSavePreview();
                    await saveCurrentGame({ silent: true });
                }
                clearInterval(autosaveTimer);
                autosaveTimer = setInterval(() => {
                    if (sceneManager?.getCurrentScene?.()?.isPaused === true) return;
                    void autoSaveCurrentGame({ reason: 'interval' });
                }, AUTO_SAVE_INTERVAL_MS);
                
                // 隐藏加载屏幕
                loadingScreen.style.display = 'none';
                
                console.log('游戏初始化完成，游戏循环已启动');
            } catch (error) {
                console.error('游戏初始化失败:', error);
                loadingText.textContent = '加载失败: ' + error.message;
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                    loginScreen.classList.remove('hidden');
                    setLoginMessage(error.message || '游戏加载失败，请重试。');
                }, 800);
            }
        }
        
        // 更新加载进度
        function updateLoading(progress, text) {
            progressFill.style.width = progress + '%';
            loadingText.textContent = text;
        }
        
        // 延迟函数
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
        
        // 是否触屏设备
        const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
        
        // DOM 提示面板统一消费 InputHints，禁止把 {move} 等 token 原样显示。
        function localizeHintKeys(html) {
            return InputHints.formatHtml(String(html || ''));
        }
        
        // 显示提示（渐进式提示，无按钮）
        function showTips(title, text) {
            tipsTitle.textContent = title;
            // 使用innerHTML支持HTML标签（触屏时把按键替换为屏幕按钮名）
            tipsText.innerHTML = localizeHintKeys(text);
            tipsPanel.classList.remove('hidden');
        }
        
        // 隐藏提示
        function hideTips() {
            tipsPanel.classList.add('hidden');
        }

        // 暴露给数据驱动场景(DataDrivenPrologueScene)复用原版提示样式
        window.__ddShowTips = (title, text) => showTips(title, text);
        window.__ddHideTips = () => hideTips();
        
        // 触控按键在页面加载后固定存在；缓存 DOM 查询并按 1% 冷却进度刷新样式，
        // 避免每个 RAF 重复 selector、布局无效化与 Canvas 图标扫描。
        const _skillCooldownButtons = [...document.querySelectorAll('.action-btn.skill[data-skill]')];
        const _moveCooldownButtons = {
            flight: document.getElementById('act-flight'),
            throw: document.getElementById('act-throw'),
            block: document.getElementById('act-block')
        };
        const _cooldownVisualState = new WeakMap();
        const _potionIconState = { health: null, mana: null };
        let _potionInventory = null;
        let _nextPotionScanAt = 0;

        function updateCooldownVisual(button, cdMs, totalMs, { readyFilter = '', coolingFilter = '' } = {}) {
            if (!button) return;
            const remaining = Math.max(0, Number(cdMs) || 0);
            const total = Math.max(1, Number(totalMs) || 1);
            const ratio = Math.min(1, remaining / total);
            const display = remaining >= 1000
                ? `${Math.ceil(remaining / 1000)}`
                : `${Math.ceil(remaining / 100) / 10}`;
            const signature = remaining > 0
                ? `cooling:${Math.ceil(ratio * 100)}:${display}:${coolingFilter}`
                : `ready:${readyFilter}`;
            if (_cooldownVisualState.get(button) === signature) return;
            _cooldownVisualState.set(button, signature);

            const overlay = button.querySelector('.skill-cd-overlay');
            const cdText = button.querySelector('.skill-cd-text');
            if (remaining > 0) {
                button.classList.add('on-cd');
                button.style.filter = coolingFilter;
                if (overlay) {
                    overlay.style.display = 'block';
                    const degrees = Math.ceil(ratio * 100) * 3.6;
                    overlay.style.background = `conic-gradient(from 0deg, rgba(0,0,0,0.75) ${degrees}deg, transparent ${degrees}deg)`;
                }
                if (cdText) {
                    cdText.style.display = 'block';
                    cdText.textContent = display;
                }
                return;
            }
            button.classList.remove('on-cd');
            button.style.filter = readyFilter;
            if (overlay) overlay.style.display = 'none';
            if (cdText) cdText.style.display = 'none';
        }

        // 更新技能按钮冷却状态（技能3/4/5 = data-skill 0/1/2）
        function updateSkillButtonCooldowns() {
            const cs = sceneManager ? sceneManager.getCurrentScene() : scene;
            if (!cs || !cs.playerEntity) return;
            const combat = cs.playerEntity.getComponent('combat');
            const stats = cs.playerEntity.getComponent('stats');
            if (!combat || !combat.skills) return;

            const currentTime = cs.simulationClock?.now?.() ?? performance.now();
            for (const btn of _skillCooldownButtons) {
                const idx = parseInt(btn.dataset.skill, 10);
                const skill = combat.skills[idx];
                if (!skill) continue;
                const cdMs = combat.getSkillCooldownRemaining(skill.id, currentTime);
                const noMana = stats && skill.manaCost && stats.mp < skill.manaCost;
                updateCooldownVisual(btn, cdMs, (skill.cooldown || 1) * 1000, {
                    readyFilter: noMana ? 'grayscale(1) opacity(0.5)' : '',
                    coolingFilter: 'grayscale(0.7) opacity(0.6)'
                });
            }
        }
        
        // 更新轻功、投掷和格挡按钮的冷却动画
        function updateMoveCooldowns() {
            const cs = sceneManager ? sceneManager.getCurrentScene() : scene;
            if (!cs) return;
            if (cs.flightSystem) {
                updateCooldownVisual(
                    _moveCooldownButtons.flight,
                    cs.flightSystem.getCooldownRemaining(),
                    cs.flightSystem.getCooldownTotal()
                );
            }
            if (cs.weaponRenderer) {
                updateCooldownVisual(
                    _moveCooldownButtons.throw,
                    cs.weaponRenderer.getThrowCooldownRemaining(),
                    cs.weaponRenderer.getThrowCooldownTotal()
                );
            }
            if (cs.combatSystem) {
                updateCooldownVisual(
                    _moveCooldownButtons.block,
                    cs.combatSystem.getBlockCooldownRemaining(),
                    cs.combatSystem.getBlockCooldownTotal()
                );
            }
        }
        
        // 更新红瓶/蓝瓶按钮：PC 风格图标 + 剩余数量
        function updatePotionButtons() {
            const cs = sceneManager ? sceneManager.getCurrentScene() : scene;
            const player = cs && cs.playerEntity;
            const inv = player && player.getComponent && player.getComponent('inventory');
            const now = performance.now();
            // 背包不变时最多每 250ms 重新扫描；实际物品使用的即时反馈仍由场景 UI 负责。
            if (_potionInventory === inv && now < _nextPotionScanAt) return;
            _potionInventory = inv;
            _nextPotionScanAt = now + 250;
            
            const defs = [
                { id: 'hb-hp', effect: 'heal', placeholderId: 'health_potion', key: 'health' },
                { id: 'hb-mp', effect: 'restore_mana', placeholderId: 'mana_potion', key: 'mana' }
            ];
            for (const def of defs) {
                const btn = document.getElementById(def.id);
                if (!btn) continue;
                const cvs = btn.querySelector('.hb-canvas');
                const countEl = btn.querySelector('.hb-count');
                if (!cvs) continue;
                
                // 统计背包中对应药水的总数与第一个物品
                let count = 0;
                let item = null;
                if (inv && inv.getAllItems) {
                    for (const { slot } of inv.getAllItems()) {
                        if (slot.item && slot.item.type === 'consumable' && slot.item.usable &&
                            slot.item.effect && slot.item.effect.type === def.effect) {
                            if (!item) item = slot.item;
                            count += slot.quantity;
                        }
                    }
                }
                
                // 数量文本
                if (countEl) countEl.textContent = `${count}`;
                
                // 图标：仅在 (物品身份 + 是否为空) 变化时重绘，避免每帧清画
                const signature = (item ? item.id : def.placeholderId) + '|' + (count > 0 ? '1' : '0');
                if (_potionIconState[def.key] !== signature) {
                    _potionIconState[def.key] = signature;
                    const ictx = cvs.getContext('2d');
                    ictx.clearRect(0, 0, cvs.width, cvs.height);
                    const drawItem = item || {
                        id: def.placeholderId, type: 'consumable', effect: { type: def.effect }
                    };
                    ictx.save();
                    if (count <= 0) ictx.globalAlpha = 0.35;
                    // 居中绘制，尺寸略小于画布
                    ItemIconRenderer.drawIcon(ictx, drawItem, cvs.width / 2, cvs.height / 2, cvs.width * 0.9);
                    ictx.restore();
                }
            }
        }
        
        function createFrameCadenceCounters() {
            return {
                rafCallbacks: 0,
                activeCallbacks: 0,
                pausedCallbacks: 0,
                hiddenCallbacks: 0,
                focusedCallbacks: 0,
                unfocusedCallbacks: 0,
                intervalCount: 0,
                intervalSum: 0,
                intervalMax: 0,
                over16: 0,
                over33: 0,
                over50: 0,
                rawDeltaMax: 0,
                clampedDeltaFrames: 0,
                timerProbeCount: 0,
                timerDelaySum: 0,
                timerDelayMax: 0,
                timerOver33: 0,
                longTaskCount: 0,
                longTaskTotal: 0,
                longTaskMax: 0
            };
        }

        function createLongTaskCounters() {
            return { count: 0, total: 0, max: 0 };
        }

        let frameLongTaskObserver = null;
        let frameLongTaskSupported = false;
        function ensureFrameLongTaskObserver() {
            if (frameLongTaskObserver || typeof PerformanceObserver === 'undefined') return;
            try {
                frameLongTaskObserver = new PerformanceObserver(list => {
                    const targetScene = sceneManager?.getCurrentScene?.() || scene;
                    const profile = targetScene?._framePerformanceProfile;
                    if (!targetScene?.debugMode || !profile?.longTasks) return;
                    for (const entry of list.getEntries()) {
                        const duration = Number(entry.duration) || 0;
                        profile.longTasks.count++;
                        profile.longTasks.total += duration;
                        profile.longTasks.max = Math.max(profile.longTasks.max, duration);
                    }
                });
                frameLongTaskObserver.observe({ entryTypes: ['longtask'] });
                frameLongTaskSupported = true;
            } catch (_error) {
                frameLongTaskObserver = null;
                frameLongTaskSupported = false;
            }
        }

        function getFramePerformanceProfile(targetScene, currentTime) {
            if (!targetScene?.debugMode) return null;
            ensureFrameLongTaskObserver();
            const profile = targetScene._framePerformanceProfile || (targetScene._framePerformanceProfile = {
                windowStartedAt: currentTime,
                frameCount: 0,
                sums: {},
                maximums: {},
                over16: 0,
                over33: 0,
                lastLongLogAt: -Infinity,
                lastRafAt: null,
                timerProbePending: false,
                cadence: createFrameCadenceCounters(),
                longTasks: createLongTaskCounters(),
                current: null
            });
            profile.cadence ||= createFrameCadenceCounters();
            profile.longTasks ||= createLongTaskCounters();
            return profile;
        }

        function recordFrameCadence(targetScene, currentTime, { paused = false, rawDeltaMs = 0, clamped = false } = {}) {
            const profile = getFramePerformanceProfile(targetScene, currentTime);
            if (!profile) return null;
            const cadence = profile.cadence;
            cadence.rafCallbacks++;
            if (paused) cadence.pausedCallbacks++;
            else cadence.activeCallbacks++;
            if (document.visibilityState !== 'visible') cadence.hiddenCallbacks++;
            if (document.hasFocus?.()) cadence.focusedCallbacks++;
            else cadence.unfocusedCallbacks++;
            if (Number.isFinite(rawDeltaMs)) cadence.rawDeltaMax = Math.max(cadence.rawDeltaMax, rawDeltaMs);
            if (clamped) cadence.clampedDeltaFrames++;
            if (Number.isFinite(profile.lastRafAt)) {
                const interval = Math.max(0, currentTime - profile.lastRafAt);
                cadence.intervalCount++;
                cadence.intervalSum += interval;
                cadence.intervalMax = Math.max(cadence.intervalMax, interval);
                if (interval > 16.7) cadence.over16++;
                if (interval > 33.3) cadence.over33++;
                if (interval > 50) cadence.over50++;
            }
            profile.lastRafAt = currentTime;

            // 每个 RAF 最多安排一个轻量 16ms timer。它与 RAF cadence 对比可区分
            // “主线程整体阻塞/节流”与“宿主只节流 requestAnimationFrame”。
            if (!profile.timerProbePending) {
                profile.timerProbePending = true;
                const scheduledAt = performance.now();
                const cadenceAtSchedule = cadence;
                setTimeout(() => {
                    profile.timerProbePending = false;
                    if (profile.cadence !== cadenceAtSchedule) return;
                    const delay = Math.max(0, performance.now() - scheduledAt);
                    cadenceAtSchedule.timerProbeCount++;
                    cadenceAtSchedule.timerDelaySum += delay;
                    cadenceAtSchedule.timerDelayMax = Math.max(cadenceAtSchedule.timerDelayMax, delay);
                    if (delay > 33.3) cadenceAtSchedule.timerOver33++;
                }, 16);
            }
            return profile;
        }

        function beginFramePerformanceProfile(targetScene, currentTime) {
            const profile = getFramePerformanceProfile(targetScene, currentTime);
            if (!profile) return null;
            profile.current = { startedAt: performance.now() };
            return profile;
        }

        function recordFramePhase(profile, name, startedAt) {
            if (profile) profile.current[name] = performance.now() - startedAt;
        }

        function finishFramePerformanceProfile(profile, targetScene, currentTime) {
            if (!profile?.current) return;
            const sample = profile.current;
            sample.total = performance.now() - sample.startedAt;
            profile.frameCount++;
            if (sample.total > 16.7) profile.over16++;
            if (sample.total > 33.3) profile.over33++;
            for (const [name, value] of Object.entries(sample)) {
                if (name === 'startedAt' || typeof value !== 'number') continue;
                profile.sums[name] = (profile.sums[name] || 0) + value;
                profile.maximums[name] = Math.max(profile.maximums[name] || 0, value);
            }
            if (sample.total > 33.3 && currentTime - profile.lastLongLogAt >= 1000) {
                profile.lastLongLogAt = currentTime;
                const phases = Object.fromEntries(Object.entries(sample)
                    .filter(([name]) => name !== 'startedAt' && name !== 'total')
                    .map(([name, value]) => [name, typeof value === 'number' ? Number(value.toFixed(2)) : value]));
                const topLevelNames = ['canvasClear', 'sceneUpdate', 'sceneRender', 'hostUi', 'savePreview'];
                const dominant = topLevelNames.reduce((best, name) => {
                    const value = Number(sample[name]) || 0;
                    return value > best.value ? { name, value } : best;
                }, { name: 'unattributed', value: 0 });
                const measured = topLevelNames.reduce((sum, name) => sum + (Number(sample[name]) || 0), 0);
                const unattributed = Math.max(0, sample.total - measured);
                const counterNames = new Set([
                    'activeParticles', 'effectZones', 'worldQueueLength',
                    'visibleEntityCount', 'worldDepthParticleCount'
                ]);
                const aggregateNames = new Set([
                    'updateDemoBeforeBase', 'updateBaseFrame', 'updateDemoAfterBase',
                    'renderScreenUi'
                ]);
                const detailEntries = Object.entries(sample)
                    .filter(([name, value]) => name !== 'startedAt' && name !== 'total'
                        && !topLevelNames.includes(name) && !counterNames.has(name)
                        && typeof value === 'number' && value > 0)
                    .sort((left, right) => right[1] - left[1]);
                const hotDetails = detailEntries.slice(0, 3)
                    .map(([name, value]) => ({ name, value }));
                const leafHotDetails = detailEntries
                    .filter(([name]) => !aggregateNames.has(name))
                    .slice(0, 6)
                    .map(([name, value]) => ({ name, value }));
                const topLevelText = topLevelNames
                    .map(name => `${name}=${(Number(sample[name]) || 0).toFixed(2)}ms`)
                    .join('，');
                const detailText = hotDetails.length > 0
                    ? hotDetails.map(item => `${item.name}=${item.value.toFixed(2)}ms`).join('，')
                    : '无';
                const leafDetailText = leafHotDetails.length > 0
                    ? leafHotDetails.map(item => `${item.name}=${item.value.toFixed(2)}ms`).join('，')
                    : '无';
                const sceneId = targetScene?.currentSceneId || targetScene?.name;
                console.warn(
                    `[DDScene][FrameProfile][长帧] ${sceneId} ${sample.total.toFixed(2)}ms；顶层 ${topLevelText}；聚合热点 ${detailText}；叶子热点 ${leafDetailText}；未归因=${unattributed.toFixed(2)}ms`,
                    {
                        sceneId,
                        milliseconds: Number(sample.total.toFixed(2)),
                        dominant,
                        hotDetails,
                        leafHotDetails,
                        unattributed: Number(unattributed.toFixed(2)),
                        loop: { generation: gameLoopGeneration, starts: gameLoopStartCount },
                        phases
                    }
                );
            }
            const windowElapsed = currentTime - profile.windowStartedAt;
            if (windowElapsed < 1000) return;
            const average = name => Number(((profile.sums[name] || 0) / Math.max(1, profile.frameCount)).toFixed(2));
            const maximum = name => Number((profile.maximums[name] || 0).toFixed(2));
            const cadence = profile.cadence;
            const intervalAverage = cadence.intervalCount > 0
                ? Number((cadence.intervalSum / cadence.intervalCount).toFixed(2))
                : 0;
            const timerDelayAverage = cadence.timerProbeCount > 0
                ? Number((cadence.timerDelaySum / cadence.timerProbeCount).toFixed(2))
                : 0;
            const effectiveFps = Number((profile.frameCount * 1000 / Math.max(1, windowElapsed)).toFixed(1));
            const rafFps = Number((cadence.rafCallbacks * 1000 / Math.max(1, windowElapsed)).toFixed(1));
            console.info('[DDScene][FrameProfile][1秒汇总]', {
                sceneId: targetScene?.currentSceneId || targetScene?.name,
                frames: profile.frameCount,
                fps: effectiveFps,
                loop: {
                    running: gameLoopRunning,
                    generation: gameLoopGeneration,
                    starts: gameLoopStartCount,
                    scheduled: gameLoopRafId !== null
                },
                rafCallbacks: cadence.rafCallbacks,
                rafFps,
                over16ms: cadence.over16,
                over33ms: cadence.over33,
                over50ms: cadence.over50,
                cpuOver16ms: profile.over16,
                cpuOver33ms: profile.over33,
                cadence: {
                    interval: { average: intervalAverage, max: Number(cadence.intervalMax.toFixed(2)) },
                    timerProbe: {
                        target: 16,
                        average: timerDelayAverage,
                        max: Number(cadence.timerDelayMax.toFixed(2)),
                        over33ms: cadence.timerOver33,
                        samples: cadence.timerProbeCount
                    },
                    activeCallbacks: cadence.activeCallbacks,
                    pausedCallbacks: cadence.pausedCallbacks,
                    hiddenCallbacks: cadence.hiddenCallbacks,
                    focusedCallbacks: cadence.focusedCallbacks,
                    unfocusedCallbacks: cadence.unfocusedCallbacks,
                    rawDeltaMax: Number(cadence.rawDeltaMax.toFixed(2)),
                    clampedDeltaFrames: cadence.clampedDeltaFrames
                },
                longTasks: {
                    supported: frameLongTaskSupported,
                    count: profile.longTasks.count,
                    total: Number(profile.longTasks.total.toFixed(2)),
                    max: Number(profile.longTasks.max.toFixed(2))
                },
                total: { average: average('total'), max: maximum('total'), meaning: 'cpuWorkMs' },
                update: { average: average('sceneUpdate'), max: maximum('sceneUpdate') },
                render: { average: average('sceneRender'), max: maximum('sceneRender') },
                hostUi: { average: average('hostUi'), max: maximum('hostUi') },
                canvasClear: { average: average('canvasClear'), max: maximum('canvasClear') },
                savePreview: { average: average('savePreview'), max: maximum('savePreview') },
                particles: {
                    update: { average: average('particleUpdate'), max: maximum('particleUpdate') },
                    effectZoneEmit: { average: average('effectZoneEmit'), max: maximum('effectZoneEmit') },
                    active: sample.activeParticles || 0,
                    zones: sample.effectZones || 0
                },
                worldQueue: {

            profile.longTasks = createLongTaskCounters();

        function scheduleNextGameFrame() {
            if (!gameLoopRunning || gameLoopRafId !== null) return false;
            const generation = gameLoopGeneration;
            gameLoopRafId = requestAnimationFrame(currentTime => {
                if (!gameLoopRunning || generation !== gameLoopGeneration) return;
                gameLoopRafId = null;
                gameLoop(currentTime);
            });
            return true;
        }

        function startGameLoop() {
            if (gameLoopRunning) return false;
            gameLoopRunning = true;
            gameLoopGeneration++;
            gameLoopStartCount++;
            lastTime = performance.now();
            return scheduleNextGameFrame();
        }

        // 游戏循环：暂停时保留唯一 RAF 和 DebugPanel DOM 循环，但定格当前 Canvas，
        // 不再运行 SceneManager、渲染管线、宿主 UI 或存档封面更新。
        function gameLoop(currentTime) {
            const profiledScene = sceneManager?.getCurrentScene?.() || scene;
            const rawDeltaTime = Math.max((currentTime - lastTime) / 1000, 0);
            // 页面切换或长任务后的异常间隔最多推进 50ms，避免实体瞬移。
            const deltaTime = Math.min(rawDeltaTime, 0.05);
            lastTime = currentTime;

            // FPS 使用真实 RAF 墙钟时间；模拟更新仍使用上面的安全钳制 delta。
            frameCount++;
            fpsTime += rawDeltaTime;
            if (fpsTime >= 1.0) {
                fps = Math.round(frameCount / fpsTime);
                frameCount = 0;
                fpsTime = 0;
            }

            const isPaused = profiledScene?.isPaused === true;
            recordFrameCadence(profiledScene, currentTime, {
                paused: isPaused,
                rawDeltaMs: rawDeltaTime * 1000,
                clamped: rawDeltaTime > 0.05
            });
            if (isPaused) {
                profiledScene.gameLoopFps = fps;
                profiledScene.discardPausedInput?.();
                scheduleNextGameFrame();
                return;
            }

            const frameProfile = beginFramePerformanceProfile(profiledScene, currentTime);
            
            // 活动场景的 RenderPipeline 会完整覆盖逻辑画面；这里只恢复变换，避免物理 backing 与逻辑画面双重全屏填充。
            const canvasClearStartedAt = frameProfile ? performance.now() : 0;
            const shouldClearBacking = !profiledScene || profiledScene.isActive === false;
            displayScaler.beginFrame(ctx, '#2a2a2a', shouldClearBacking);
            recordFramePhase(frameProfile, 'canvasClear', canvasClearStartedAt);
            
            // 更新和渲染场景
            if (sceneManager) {
                const sceneUpdateStartedAt = frameProfile ? performance.now() : 0;
                sceneManager.update(deltaTime);
                recordFramePhase(frameProfile, 'sceneUpdate', sceneUpdateStartedAt);
                const sceneRenderStartedAt = frameProfile ? performance.now() : 0;
                sceneManager.render(ctx);
                recordFramePhase(frameProfile, 'sceneRender', sceneRenderStartedAt);
                const hostUiStartedAt = frameProfile ? performance.now() : 0;
                updateSkillButtonCooldowns();
                // 更新轻功/投掷按钮冷却状态
                updateMoveCooldowns();
                // 更新红瓶/蓝瓶图标与数量
                updatePotionButtons();
                
                // 对话框由场景自己渲染，这里不需要重复渲染
                
                // 更新和渲染技能树面板
                if (skillTreePanel) {
                    skillTreePanel.render(ctx);
                }
                
                // 更新和渲染通知系统
                if (notificationSystem) {
                    notificationSystem.update(deltaTime * 1000); // 转换为毫秒
                    notificationSystem.render(ctx);
                }
                
                // 背包面板由场景自己渲染，这里不需要重复渲染
                // 只有当场景没有背包面板时才渲染全局的
                if (inventoryPanel && (!scene || !scene.inventoryPanel)) {
                    inventoryPanel.update(deltaTime);
                    inventoryPanel.render(ctx);
                }
                
                // 角色信息面板由场景自己渲染，这里不需要重复渲染
                // 只有当场景没有角色信息面板时才渲染全局的
                if (playerInfoPanel && (!scene || !scene.playerInfoPanel)) {
                    playerInfoPanel.update(deltaTime);
                    playerInfoPanel.render(ctx);
                }
                
                // 获取当前场景
                const currentScene = sceneManager.getCurrentScene();
                
                // 如果场景切换了，设置新场景的回调
                if (currentScene !== scene) {
                    console.log('场景切换检测到，设置新场景回调');
                    scene = currentScene;
                    if (scene) {
                        setupSceneCallbacks(scene);
                        
                        // 如果是第二幕场景，设置玩家实体和背包面板
                        if (scene.setPlayerEntity && scene.playerEntity) {
                            scene.setPlayerEntity(scene.playerEntity);
                        }
                        
                        // 更新背包面板的实体引用
                        if (inventoryPanel && scene.playerEntity) {
                            inventoryPanel.setEntity(scene.playerEntity);
                        }
                        
                        // 重置技能树面板和属性面板（因为不同场景可能有不同的系统实例）
                        if (skillTreePanel) {
                            skillTreePanel.hide();
                            skillTreePanel = null;
                        }
                        if (attributePanel) {
                            attributePanel.hide();
                            attributePanel = null;
                        }
                        // 重置全局角色信息面板（因为不同场景可能有不同的玩家实体）
                        if (playerInfoPanel) {
                            playerInfoPanel.hide();
                            playerInfoPanel = null;
                        }
                    }
                }
                
                // 更新调试信息
                if (scene) {
                    updateDebugInfo();
                }
                recordFramePhase(frameProfile, 'hostUi', hostUiStartedAt);
            }
            
            // 首帧存档等待器存在时才发起一次异步封面编码；普通 RAF 不再同步压缩 JPEG。
            if (renderedPreviewWaiters.size > 0 && !savePreviewCaptureInFlight) {
                const savePreviewStartedAt = frameProfile ? performance.now() : 0;
                void updateRenderedSavePreview();
                recordFramePhase(frameProfile, 'savePreview', savePreviewStartedAt);
            } else if (frameProfile) {
                frameProfile.current.savePreview = 0;
            }
            finishFramePerformanceProfile(frameProfile, profiledScene, currentTime);
            scheduleNextGameFrame();
        }
        
        // 更新调试信息（向新 DebugPanel 暴露主游戏循环 FPS + 刷新技能栏）
        function updateDebugInfo() {
            if (!scene) return;

            // 向通用 DebugPanel 暴露主游戏循环的真实 FPS 快照
            scene.gameLoopFps = fps;

        function updateSkillBar() {

            const skills = scene.playerEntity.getComponent('skills');
            if (!skills) return;
            
            const skillSlots = document.querySelectorAll('.skill-slot');
            skillSlots.forEach((slot, index) => {

                if (!skill) return;
                
                // 检查冷却
                const cooldownRemaining = skills.getCooldownRemaining(skill.id);
                const isOnCooldown = cooldownRemaining > 0;
                
                // 更新样式
                if (isOnCooldown) {
                    slot.classList.add('on-cooldown');
                    // 显示冷却时间

                    if (!cooldownDiv) {

                        cooldownDiv.className = 'skill-cooldown';
                        slot.appendChild(cooldownDiv);
                    }
                    cooldownDiv.textContent = Math.ceil(cooldownRemaining);
                } else {
