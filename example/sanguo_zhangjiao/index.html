        // ============ 屏幕触控按钮接线 ============
        /**
         * 左下角虚拟摇杆
         * - 透明圆形热区，手指按下处作为摇杆中心
         * - 显示手指方向的 90° 扇形圆周，并在圆周上绘制方向小箭头
         * - 将方向换算为 上/下/左/右 组合键，派发键盘事件复用移动系统
         */
        function setupVirtualJoystick(pressKey, releaseKey, dirKey) {
            const zone = document.getElementById('joystick-zone');
            const cvs = document.getElementById('joystick-overlay');
            const gameCanvas = document.getElementById('gameCanvas');
            if (!zone || !cvs || !gameCanvas) return;
            const jctx = cvs.getContext('2d');
            
            const RADIUS = 70;          // 摇杆圆周半径（canvas 像素）
            const DEAD_ZONE = 18;       // 死区
            
            let active = false;
            let centerX = 0, centerY = 0;   // 摇杆中心（canvas 像素坐标）
            let curX = 0, curY = 0;
            let activeDirs = { up: false, down: false, left: false, right: false };
            
            function resize() {
                // 覆盖层与主 canvas 同像素尺寸，绘制坐标 = canvas 像素坐标
                cvs.width = gameCanvas.width;
                cvs.height = gameCanvas.height;
                if (active) render();
            }
            resize();
            window.addEventListener('resize', () => setTimeout(resize, 50));
            window.addEventListener('orientationchange', () => setTimeout(resize, 150));
            
            // 复用全局指针变换（已处理旋转/缩放），回退到简单 rect 映射
            function clientToCanvas(clientX, clientY) {
                if (typeof window.__pointerTransform === 'function') {
                    return window.__pointerTransform(clientX, clientY);
                }
                const rect = gameCanvas.getBoundingClientRect();
                const sx = gameCanvas.width / rect.width;
                const sy = gameCanvas.height / rect.height;
                return { x: (clientX - rect.left) * sx, y: (clientY - rect.top) * sy };
            }
            
            // 根据角度计算 8 向（换算为方向键组合）
            function updateDirection(dx, dy) {
                const dist = Math.sqrt(dx * dx + dy * dy);
                const next = { up: false, down: false, left: false, right: false };
                if (dist >= DEAD_ZONE) {
                    let ang = Math.atan2(dy, dx) * 180 / Math.PI; // y 向下为正
                    if (ang < 0) ang += 360;
                    if (ang >= 22.5 && ang < 67.5)      { next.down = true; next.right = true; }
                    else if (ang >= 67.5 && ang < 112.5)  { next.down = true; }
                    else if (ang >= 112.5 && ang < 157.5) { next.down = true; next.left = true; }
                    else if (ang >= 157.5 && ang < 202.5) { next.left = true; }
                    else if (ang >= 202.5 && ang < 247.5) { next.up = true; next.left = true; }
                    else if (ang >= 247.5 && ang < 292.5) { next.up = true; }
                    else if (ang >= 292.5 && ang < 337.5) { next.up = true; next.right = true; }
                    else                                   { next.right = true; }
                }
                for (const d of ['up', 'down', 'left', 'right']) {
                    if (next[d] && !activeDirs[d]) pressKey(dirKey[d]);
                    else if (!next[d] && activeDirs[d]) releaseKey(dirKey[d]);
                }
                activeDirs = next;
            }
            
            function releaseAll() {
                for (const d of ['up', 'down', 'left', 'right']) {
                    if (activeDirs[d]) releaseKey(dirKey[d]);
                }
                activeDirs = { up: false, down: false, left: false, right: false };
            }
            
            function render() {
                jctx.clearRect(0, 0, cvs.width, cvs.height);
                if (!active) return;
                
                const dx = curX - centerX;
                const dy = curY - centerY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                // 基础圆（淡）
                jctx.beginPath();
                jctx.arc(centerX, centerY, RADIUS, 0, Math.PI * 2);
                jctx.strokeStyle = 'rgba(255,255,255,0.25)';
                jctx.lineWidth = 2;
                jctx.stroke();
                
                if (dist >= DEAD_ZONE) {
                    const ang = Math.atan2(dy, dx);
                    const half = Math.PI / 4; // 90° 扇形 => 半角 45°
                    
                    // 高亮 90° 扇形圆周弧
                    jctx.beginPath();
                    jctx.arc(centerX, centerY, RADIUS, ang - half, ang + half);
                    jctx.strokeStyle = 'rgba(139,195,74,0.95)';
                    jctx.lineWidth = 5;
                    jctx.lineCap = 'round';
                    jctx.stroke();
                    
                    // 圆周上的方向小箭头（位于弧中点 = 手指方向）
                    const ax = centerX + Math.cos(ang) * RADIUS;
                    const ay = centerY + Math.sin(ang) * RADIUS;
                    const size = 12;
                    jctx.save();
                    jctx.translate(ax, ay);
                    jctx.rotate(ang);
                    jctx.beginPath();
                    jctx.moveTo(size, 0);
                    jctx.lineTo(-size * 0.6, -size * 0.7);
                    jctx.lineTo(-size * 0.6, size * 0.7);
                    jctx.closePath();
                    jctx.fillStyle = '#8BC34A';
                    jctx.fill();
                    jctx.restore();
                }
                
                // 摇杆中心点
                jctx.beginPath();
                jctx.arc(centerX, centerY, 8, 0, Math.PI * 2);
                jctx.fillStyle = 'rgba(255,255,255,0.6)';
                jctx.fill();
            }
            
            function start(clientX, clientY) {
                const p = clientToCanvas(clientX, clientY);
                centerX = p.x; centerY = p.y;
                curX = p.x; curY = p.y;
                active = true;
                render();
            }
            function move(clientX, clientY) {
                if (!active) return;
                const p = clientToCanvas(clientX, clientY);
                curX = p.x; curY = p.y;
                updateDirection(curX - centerX, curY - centerY);
                render();
            }
            function end() {
                active = false;
                releaseAll();
                render();
            }
            
            // 触摸事件
            zone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const t = e.changedTouches[0];
                start(t.clientX, t.clientY);
            }, { passive: false });
            zone.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const t = e.changedTouches[0];
                move(t.clientX, t.clientY);
            }, { passive: false });
            zone.addEventListener('touchend', (e) => { e.preventDefault(); end(); }, { passive: false });
            zone.addEventListener('touchcancel', (e) => { e.preventDefault(); end(); }, { passive: false });
            
            // 鼠标兼容（桌面测试）
            zone.addEventListener('mousedown', (e) => { start(e.clientX, e.clientY); });
            window.addEventListener('mousemove', (e) => { if (active) move(e.clientX, e.clientY); });
            window.addEventListener('mouseup', () => { if (active) end(); });
        }
        
        function setupTouchControls() {
            const touchControls = document.getElementById('touch-controls');
            if (!touchControls) return;
            
            // 触屏设备才显示（也可在桌面用鼠标按下测试）
            const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
            if (isTouch) {
                touchControls.classList.add('active');
            }
            
            // ===== 左下角虚拟摇杆 =====
            // 手指按住时显示一个 90° 扇形圆周 + 圆周上的方向小箭头，
            // 通过派发方向键事件复用 InputManager / MovementSystem。
            const dirKey = { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' };
            
            function pressKey(key) {
                window.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true }));
            }
            function releaseKey(key) {
                window.dispatchEvent(new KeyboardEvent('keyup', { key, bubbles: true }));
            }
            
            setupVirtualJoystick(pressKey, releaseKey, dirKey);
            
            // 功能按钮（技能 / 攻击 / 轻功 / 投掷 / 药品 / 背包 / 装备）
            function triggerAction(btn) {
                const currentScene = sceneManager ? sceneManager.getCurrentScene() : scene;
                if (!currentScene) return;
                if (btn.dataset.skill !== undefined) {
                    const idx = parseInt(btn.dataset.skill, 10);
                    // 复用框架场景的按索引释放技能（按角色朝向）
                    if (currentScene.useSkillByIndex) currentScene.useSkillByIndex(idx);
                } else if (btn.dataset.potion !== undefined) {
                    // 可使用物品：生命/魔法药水
                    if (currentScene.usePotionFromHotbar) currentScene.usePotionFromHotbar(btn.dataset.potion);
                } else if (btn.dataset.act === 'attack') {
                    // 攻击按钮现在走瞄准流程,此处不再触发
                } else if (btn.dataset.act === 'block') {
                    // 格挡按钮
                    if (currentScene.activateBlock) currentScene.activateBlock();
                } else if (btn.dataset.act === 'interact') {
                    // 交互按钮直接进入统一 InputActionRouter；不再夹带旧 N 场景推进。
                    enqueueSceneInteract();
                } else if (btn.dataset.act === 'axe') {
                    // 斧头/采集按钮是统一交互按钮的兼容 UI 别名。
                    enqueueSceneInteract();
                } else if (btn.dataset.act === 'flight') {
                    // 轻功现在走瞄准流程,此处不再触发
                } else if (btn.dataset.act === 'jump') {
                    // 触屏跳跃改为蓄力：按住设置保持标志（帧轮询驱动蓄力），松手时释放起跳。
                    if (currentScene.setJumpHeld) currentScene.setJumpHeld(true);
                } else if (btn.dataset.act === 'throw') {
                    // 投掷现在走瞄准流程,此处不再触发
                } else if (btn.dataset.action === 'bag') {
                    if (currentScene.inventoryPanel) currentScene.inventoryPanel.toggle();
                } else if (btn.dataset.action === 'settings') {
                    currentScene.openSystemMenu?.();
                } else if (btn.dataset.action === 'char') {
                    // 装备栏 = PlayerInfoPanel
                    if (currentScene.playerInfoPanel) currentScene.playerInfoPanel.toggle();
                }
            }
            
            // 移动端交互优先直接入队；旧场景没有公开入口时才回退合成 E。
            function enqueueSceneInteract() {
                const currentScene = sceneManager ? sceneManager.getCurrentScene() : scene;
                if (currentScene?.enqueueInteract) currentScene.enqueueInteract('touch');
                else tapKey('e');
            }

            // 兼容旧控件的点按型虚拟按键。
            const keyMap = { e: 'e' };
            function tapKey(key) {
                window.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true }));
                // 稍后释放，确保 isKeyDown 在至少一帧内为 true
                setTimeout(() => {
                    window.dispatchEvent(new KeyboardEvent('keyup', { key, bubbles: true }));
                }, 160);
            }
            
            // 圆形动作按钮 + 底部快捷栏按钮，统一绑定
            // 用 lastTouchTime 防止触摸后浏览器合成的 mouse 事件造成"双触发"
            let lastTouchTime = 0;
            
            // ===== 技能瞄准系统（技能3/4/5：按住拖动选方向，松手释放） =====
            const skillAim = {
                active: false,      // 是否正在瞄准
                skillIndex: -1,     // 技能索引
                btn: null,          // 按下的按钮元素
                touchId: -1,        // 触摸点 identifier（区分多指）
                startX: 0,          // 按下时手指屏幕坐标
                startY: 0,
                curX: 0,            // 当前手指屏幕坐标
                curY: 0,
                radius: 100,        // 瞄准圆半径（像素，屏幕坐标）—— 拖拽此距离 = 最大射程
                anchorWorldPos: null, // 按下瞄准时的玩家世界坐标（锚点）
            };
            // 瞄准圆渲染(画在 joystick overlay canvas 上)
            const aimCvs = document.getElementById('joystick-overlay');
            const aimCtx = aimCvs ? aimCvs.getContext('2d') : null;
            
            function renderSkillAim() {
                // 瞄准圆绘制在 joystick overlay(已有 requestAnimationFrame loop)
                // 由摇杆 loop 调用此函数
            }
            // 把渲染钩入摇杆的 render loop：在 setupVirtualJoystick 的 loop 里
            // 无法直接改动闭包，所以我另起一个 raf loop 专门画瞄准圈
            function skillAimLoop() {
                if (aimCtx && skillAim.active) {
                    const sx = skillAim.startX;
                    const sy = skillAim.startY;
                    const cx = skillAim.curX;
                    const cy = skillAim.curY;
                    const dx = cx - sx;
                    const dy = cy - sy;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    // 在按钮中心画圆圈(屏幕坐标 → 需要用 getBoundingClientRect)
                    // 简化:直接在 overlay canvas 上用 canvas 像素坐标画
                    // 但 overlay canvas 是游戏画面像素坐标...
                    // 为了简便，在按钮上方叠一个临时的 DOM 圆圈
                }
                requestAnimationFrame(skillAimLoop);
            }
            // 不用 canvas 画,用 CSS 圆圈更简洁可靠（避开坐标换算）
            // 创建一个临时的瞄准指示 DOM 元素
            const aimIndicator = document.createElement('div');
            aimIndicator.id = 'skill-aim-indicator';
            aimIndicator.style.cssText = 'position:fixed;pointer-events:none;display:none;z-index:99999;';
            aimIndicator.innerHTML = '<div class="aim-ring"></div><div class="aim-arrow"></div>';
            document.body.appendChild(aimIndicator);
            
            // 对应 CSS（内联添加）
            const aimStyle = document.createElement('style');
            aimStyle.textContent = `
                #skill-aim-indicator {
                    width: 120px; height: 120px;
                    transform: translate(-50%, -50%);
                }
                #skill-aim-indicator .aim-ring {
                    position: absolute; inset: 0;
                    border: 3px solid rgba(139,195,74,0.85);
                    border-radius: 50%;
                }
                #skill-aim-indicator .aim-arrow {
                    position: absolute;
                    left: 50%; top: 50%;
                    width: 14px; height: 14px;
                    margin: -7px 0 0 -7px;
                    background: #8BC34A;
                    clip-path: polygon(100% 50%, 0 0, 0 100%);
                    transform-origin: center center;
                    transform: rotate(0deg) translateX(100px);
                    display: none;
                }
            `;
            document.head.appendChild(aimStyle);
            
            function startSkillAim(btn, skillIdx, clientX, clientY, touchId) {
                skillAim.active = true;
                skillAim.skillIndex = skillIdx;
                skillAim.btn = btn;
                skillAim.touchId = touchId !== undefined ? touchId : -1;
                skillAim.startX = clientX;
                skillAim.startY = clientY;
                skillAim.curX = clientX;
                skillAim.curY = clientY;
                // 记录瞄准开始时玩家世界坐标作为锚点
                const currentScene = sceneManager ? sceneManager.getCurrentScene() : scene;
                skillAim.anchorWorldPos = null;
                if (currentScene && currentScene.playerEntity) {
                    const t = currentScene.playerEntity.getComponent('transform');
                    if (t) skillAim.anchorWorldPos = { x: t.position.x, y: t.position.y };
                }
                // 显示瞄准圈在按钮中心
                aimIndicator.style.display = 'block';
                aimIndicator.style.left = clientX + 'px';
                aimIndicator.style.top = clientY + 'px';
                aimIndicator.querySelector('.aim-arrow').style.display = 'none';
                // 瞄准时让其他按钮不遮挡摇杆圈
                const actionBtns = document.getElementById('action-buttons');
                if (actionBtns) actionBtns.style.zIndex = '1';
                // 让被按的按钮自身半透明,不遮挡瞄准圈
                btn.style.opacity = '0.25';
                // 初始时落点在玩家自身(distRatio=0)
                if (currentScene && currentScene.setSkillAimPreview) {
                    currentScene.setSkillAimPreview(skillIdx, 1, 0, 0, skillAim.anchorWorldPos);
                }
            }
            
            function moveSkillAim(clientX, clientY) {
                if (!skillAim.active) return;
                skillAim.curX = clientX;
                skillAim.curY = clientY;
                const dx = clientX - skillAim.startX;
                const dy = clientY - skillAim.startY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const arrow = aimIndicator.querySelector('.aim-arrow');
                // 拖拽距离占瞄准圈半径的比例 → 映射到 0~1(=最大射程)
                const distRatio = dist / skillAim.radius;
                
                const currentScene = sceneManager ? sceneManager.getCurrentScene() : scene;
                
                // 始终按实际拖拽距离和方向更新（无死区，手指在中心附近也正常映射）
                if (dist > 2) {
                    const ang = Math.atan2(dy, dx) * 180 / Math.PI;
                    arrow.style.display = 'block';
                    arrow.style.transform = `rotate(${ang}deg) translateX(80px)`;
                    // 范围内绿色,范围外红色
                    const inRange = distRatio <= 1.0;
                    arrow.style.background = inRange ? '#8BC34A' : '#ff4444';
                    aimIndicator.querySelector('.aim-ring').style.borderColor =
                        inRange ? 'rgba(139,195,74,0.85)' : 'rgba(255,68,68,0.85)';
                    // 更新游戏世界中的技能落点预览
                    if (currentScene && currentScene.setSkillAimPreview) {
                        currentScene.setSkillAimPreview(skillAim.skillIndex, dx, dy, distRatio, skillAim.anchorWorldPos);
                    }
                    // 攻击按钮：拖动时让扇形方向跟随手指（不攻击，仅更新方向指示）
                    if (skillAim.skillIndex === ATTACK_AIM_INDEX && currentScene && currentScene.meleeAttackSystem) {
                        const ang = Math.atan2(dy, dx);
                        currentScene.meleeAttackSystem.sectorDirection = ang;
                        currentScene.meleeAttackSystem.sectorDirectionLocked = true;
                    }
                } else {
                    arrow.style.display = 'none';
                    // 距离极小:保持在玩家正前方极近处（使用上次方向或默认朝向）
                    if (currentScene && currentScene.setSkillAimPreview) {
                        currentScene.setSkillAimPreview(skillAim.skillIndex, dx || 1, dy || 0, distRatio, skillAim.anchorWorldPos);
                    }
                }
            }
            
            function endSkillAim() {
                if (!skillAim.active) return;
                const dx = skillAim.curX - skillAim.startX;
                const dy = skillAim.curY - skillAim.startY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const distRatio = dist / skillAim.radius;
                
                const currentScene = sceneManager ? sceneManager.getCurrentScene() : scene;
                if (currentScene) {
                    if (dist > 10 && distRatio <= 1.0) {
                        // 在范围内且有方向拖拽 → 释放
                        if (skillAim.skillIndex === ATTACK_AIM_INDEX) {
                            // 攻击按钮：从当前玩家位置到预览圈位置计算实际发射方向
                            if (currentScene.attackByDirection) {
                                // 如果有预览圈（远程），用预览圈世界坐标计算方向
                                if (currentScene.skillAimPreview && currentScene.playerEntity) {
                                    const t = currentScene.playerEntity.getComponent('transform');
                                    if (t) {
                                        const realDx = currentScene.skillAimPreview.targetX - t.position.x;
                                        const realDy = currentScene.skillAimPreview.targetY - t.position.y;
                                        currentScene.attackByDirection(realDx, realDy, distRatio);
                                    } else {
                                        currentScene.attackByDirection(dx, dy, distRatio);
                                    }
                                } else {
                                    currentScene.attackByDirection(dx, dy, distRatio);
                                }
                            }
                        } else if (skillAim.skillIndex === THROW_AIM_INDEX) {
                            // 投掷按钮：按方向投掷
                            if (currentScene.throwByDirection) {
                                currentScene.throwByDirection(dx, dy, distRatio);
                            } else if (currentScene.throwByFacing) {
                                currentScene.throwByFacing();
                            }
                        } else if (skillAim.skillIndex === FLIGHT_AIM_INDEX) {
                            // 轻功按钮：按方向轻功
                            if (currentScene.flightByDirection) {
                                currentScene.flightByDirection(dx, dy, distRatio);
                            } else if (currentScene.flightByFacing) {
                                currentScene.flightByFacing();
                            }
                        } else {
                            // 技能按钮：使用预览圈世界坐标作为技能目标
                            if (currentScene.useSkillByDirection) {
                                let targetWorldPos = null;
                                if (currentScene.skillAimPreview) {
                                    targetWorldPos = {
                                        x: currentScene._lastAimWorldX || currentScene.skillAimPreview.targetX,
                                        y: currentScene._lastAimWorldY || currentScene.skillAimPreview.targetY
                                    };
                                }
                                currentScene.useSkillByDirection(skillAim.skillIndex, dx, dy, distRatio, targetWorldPos);
                            }
                        }
                    } else if (dist <= 10) {
                        // 没拖或拖动极小 → 按默认朝向释放
                        if (skillAim.skillIndex === ATTACK_AIM_INDEX) {
                            if (currentScene.attackByFacing) currentScene.attackByFacing();
                        } else if (skillAim.skillIndex === THROW_AIM_INDEX) {
                            if (currentScene.throwByFacing) currentScene.throwByFacing();
                        } else if (skillAim.skillIndex === FLIGHT_AIM_INDEX) {
                            if (currentScene.flightByFacing) currentScene.flightByFacing();
                        } else {
                            if (currentScene.useSkillByIndex) {
                                currentScene.useSkillByIndex(skillAim.skillIndex);
                            }
                        }
                    }
                    // 超出范围(distRatio > 1.0 && dist > 10) → 不释放(取消)
                    
                    // 清除游戏世界中的落点预览
                    if (currentScene.clearSkillAimPreview) {
                        currentScene.clearSkillAimPreview();
                    }
                }
                
                // 隐藏
                skillAim.active = false;
                aimIndicator.style.display = 'none';
                if (skillAim.btn) {
                    skillAim.btn.classList.remove('pressed');
                    skillAim.btn.style.opacity = '';
                }
                // 恢复按钮组层级
                const actionBtns = document.getElementById('action-buttons');
                if (actionBtns) actionBtns.style.zIndex = '';
            }
            
            // 全局 touch/mouse move 用于技能瞄准拖拽
            window.addEventListener('touchmove', (e) => {
                if (!skillAim.active) return;
                // 用 touch identifier 找到瞄准手指
                for (let i = 0; i < e.touches.length; i++) {
                    if (e.touches[i].identifier === skillAim.touchId) {
                        moveSkillAim(e.touches[i].clientX, e.touches[i].clientY);
                        return;
                    }
                }
            }, { passive: true });
            window.addEventListener('mousemove', (e) => {
                if (skillAim.active) moveSkillAim(e.clientX, e.clientY);
            });
            window.addEventListener('touchend', (e) => {
                if (!skillAim.active) return;
                // 只有瞄准手指抬起才结束
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === skillAim.touchId) {
                        endSkillAim();
                        return;
                    }
                }
            });
            window.addEventListener('touchcancel', (e) => {
                if (!skillAim.active) return;
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === skillAim.touchId) {
                        endSkillAim();
                        return;
                    }
                }
            });
            window.addEventListener('mouseup', (e) => { if (skillAim.active) endSkillAim(); });
            
            // 需要瞄准的技能索引集合（技能3/4/5 = 索引 0/1/2）
            const AIM_SKILLS = new Set([0, 1, 2]);
            // 攻击按钮也走瞄准流程,用 -1 标识
            const ATTACK_AIM_INDEX = -1;
            // 投掷和轻功也走瞄准流程
            const THROW_AIM_INDEX = -2;
            const FLIGHT_AIM_INDEX = -3;
            
            document.querySelectorAll('.action-btn, .hotbar-btn').forEach(btn => {
                const isAimSkill = btn.dataset.skill !== undefined && AIM_SKILLS.has(parseInt(btn.dataset.skill, 10));
                const isAttackBtn = btn.dataset.act === 'attack';
                const isThrowBtn = btn.dataset.act === 'throw';
                const isFlightBtn = btn.dataset.act === 'flight';
                const isAimBtn = isAimSkill || isAttackBtn || isThrowBtn || isFlightBtn;
                
                const doPress = (clientX, clientY, touchId) => {
                    btn.classList.add('pressed');
                    if (isAimSkill) {
                        // 进入技能瞄准模式
                        startSkillAim(btn, parseInt(btn.dataset.skill, 10), clientX, clientY, touchId);
                    } else if (isAttackBtn) {
                        // 攻击按钮始终进入瞄准模式
                        startSkillAim(btn, ATTACK_AIM_INDEX, clientX, clientY, touchId);
                    } else if (isThrowBtn) {
                        // 投掷按钮进入瞄准模式
                        startSkillAim(btn, THROW_AIM_INDEX, clientX, clientY, touchId);
                    } else if (isFlightBtn) {
                        // 轻功按钮进入瞄准模式
                        startSkillAim(btn, FLIGHT_AIM_INDEX, clientX, clientY, touchId);
                    } else if (btn.dataset.act === 'interact') {
                        // 交互按钮直接进入统一 InputActionRouter。
                        enqueueSceneInteract();
                    } else if (btn.dataset.act === 'axe') {
                        // 斧头/采集按钮是统一交互按钮的兼容 UI 别名。
                        enqueueSceneInteract();
                    } else if (btn.dataset.act === 'block') {
                        // 格挡按钮：直接激活
                        const currentScene = sceneManager ? sceneManager.getCurrentScene() : scene;
                        if (currentScene && currentScene.activateBlock) currentScene.activateBlock();
                    } else if (btn.dataset.key !== undefined) {
                        tapKey(keyMap[btn.dataset.key] || btn.dataset.key);
                    } else {
                        triggerAction(btn);
                    }
                };
                const onTouch = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    lastTouchTime = Date.now();
                    const t = e.changedTouches[0];
                    doPress(t.clientX, t.clientY, t.identifier);
                };
                const onMouse = (e) => {
                    if (Date.now() - lastTouchTime < 600) return;
                    e.preventDefault();
                    e.stopPropagation();
                    doPress(e.clientX, e.clientY, -1);
                };
                const release = (e) => {
                    e.preventDefault();
                    if (isAimBtn && skillAim.active) {
                        // 瞄准按钮释放由全局 touchend/mouseup 处理
                        return;
                    }
                    btn.classList.remove('pressed');
                    // 触屏跳跃按钮：松手清除保持标志，帧轮询随即按蓄力时间起跳。
                    if (btn.dataset.act === 'jump') {
                        const currentScene = sceneManager ? sceneManager.getCurrentScene() : scene;
                        if (currentScene && currentScene.setJumpHeld) currentScene.setJumpHeld(false);
                    }
                };
                btn.addEventListener('touchstart', onTouch, { passive: false });
                btn.addEventListener('touchend', release, { passive: false });
                btn.addEventListener('touchcancel', release, { passive: false });
                btn.addEventListener('mousedown', onMouse);
                btn.addEventListener('mouseup', release);
            });
        }
        setupTouchControls();
        
        // ===== 应用 UI 编辑器保存的布局到触屏 DOM 按钮（百分比 → 相对 touch-controls 定位）=====
        // 编辑器用统一的"满画布坐标系"，而按钮原本嵌套在 #action-buttons / #bottom-hotbar 内，
        // 为让百分比直接生效，把可编辑按钮重挂到 #touch-controls 并用百分比定位。
        async function applyUILayoutToDom() {
            const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
            if (!isTouch) return; // 仅移动端应用
            let layout;
            try {
                const res = await fetch('config/UILayout.mobile.json');
                if (!res.ok) return;
                layout = await res.json();
            } catch (e) { return; }
            if (!layout || !Array.isArray(layout.components)) return;
            
            const touchControls = document.getElementById('touch-controls');
            if (!touchControls) return;
            
            // 可编辑的 DOM 按钮 id（与编辑器组件 id 对应）
            const domIds = {
                'joystick': 'joystick-zone',
                'act-attack': 'act-attack',
                'act-block': 'act-block',
                'act-skill3': 'act-skill3',
                'act-skill4': 'act-skill4',
                'act-skill5': 'act-skill5',
                'act-flight': 'act-flight',
                'act-jump': 'act-jump',
                'act-interact': 'act-interact',
                'act-throw': 'act-throw',
                'act-axe': 'act-axe',
                'hb-hp': 'hb-hp',
                'hb-mp': 'hb-mp',
                'hb-bag': 'hb-bag',
                'hb-settings': 'hb-settings',
                'hb-skill6': 'hb-skill6',
                'hb-skill7': 'hb-skill7'
            };
            
            const componentsById = new Map(layout.components
                .filter(comp => comp && typeof comp.id === 'string')
                .map(comp => [comp.id, comp]));
            for (const [componentId, elId] of Object.entries(domIds)) {
                const el = document.getElementById(elId);
                if (!el) continue;
                const comp = componentsById.get(componentId);
                // UILayout.mobile.json 是 Android 触屏按钮的精确清单：
                // 缺失表示该按钮已在 UI 编辑器删除，不能回退显示 HTML 默认按钮。
                if (!comp || comp.xPct === undefined) {
                    el.style.display = 'none';
                    el.setAttribute('aria-hidden', 'true');
                    continue;
                }
                el.style.display = '';
                el.removeAttribute('aria-hidden');
                // 重挂到 touch-controls，使百分比相对全屏容器
                if (el.parentElement !== touchControls) {
                    touchControls.appendChild(el);
                }
                // 获取容器实际尺寸，计算像素值（确保按钮尺寸与UI编辑器一致）
                const containerW = touchControls.clientWidth || window.innerWidth;
                const containerH = touchControls.clientHeight || window.innerHeight;
                const px = Math.round(comp.xPct * containerW);
                const py = Math.round(comp.yPct * containerH);
                const pw = Math.round(comp.wPct * containerW);
                const ph = Math.round(comp.hPct * containerH);
                // 对于圆形按钮，取宽高中较小值保持正方形
                const isCircle = (comp.kind === 'button');
                const size = isCircle ? Math.min(pw, ph) : 0;
                el.style.position = 'absolute';
                el.style.left = px + 'px';
                el.style.top = py + 'px';
                el.style.width = (isCircle ? size : pw) + 'px';
                el.style.height = (isCircle ? size : ph) + 'px';
                el.style.right = 'auto';
                el.style.bottom = 'auto';
                el.style.maxWidth = 'none';
            }
        }
        applyUILayoutToDom();
        
        // ===== 竖屏时直接以横屏方式显示（不锁定方向，仅 CSS 旋转页面） =====
        // 当处于竖屏时给 body 加 .force-landscape，#game-container 被旋转 90° 填满屏幕。
        // 同时为 InputManager 安装坐标变换钩子，修正旋转后的触摸/点击坐标。
        function applyForceLandscape() {
            const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
            const portrait = window.innerHeight > window.innerWidth;
            const rotate = isTouch && portrait;
            const wasRotate = document.body.classList.contains('force-landscape');
            document.body.classList.toggle('force-landscape', rotate);
            // 旋转后容器尺寸变化，需等 CSS 生效后再重算 canvas 尺寸
            if (rotate !== wasRotate) {
                // 类名切换后延迟一帧让布局生效
                requestAnimationFrame(() => { resizeCanvas(); });
            } else {
                resizeCanvas();
            }
            return rotate;
        }
        
        // 坐标变换：把页面坐标映射回 canvas 像素坐标（考虑旋转 + 缩放）
        function makePointerTransform() {
            return (clientX, clientY) => {
                const rotate = document.body.classList.contains('force-landscape');
                const rect = canvas.getBoundingClientRect();
                // 获取当前场景的逻辑尺寸（camera 尺寸），确保与渲染坐标系一致
                const cs = sceneManager ? sceneManager.getCurrentScene() : null;
                const logicW = (cs && cs.logicalWidth) || canvas.logicalWidth || logicalResolution.width;
                const logicH = (cs && cs.logicalHeight) || canvas.logicalHeight || logicalResolution.height;
                if (!rotate) {
                    // 未旋转：归一化到逻辑坐标
                    const x = (clientX - rect.left) / rect.width * logicW;
                    const y = (clientY - rect.top) / rect.height * logicH;
                    return { x, y };
                }
                // 旋转 90°（顺时针）：rect 是旋转后的外接矩形（屏幕坐标）
                const px = clientX - rect.left;
                const py = clientY - rect.top;
                // 顺时针 90°：canvasX 沿屏幕竖直方向，canvasY 沿屏幕水平反方向
                const cx = py / rect.height * logicW;
                const cy = (rect.width - px) / rect.width * logicH;
                return { x: cx, y: cy };
            };
        }
        
        function setupOrientation() {
            const rotate = applyForceLandscape();
            // 安装坐标变换钩子到当前场景的 InputManager
            const transform = makePointerTransform();
            const installer = () => {
                const cs = sceneManager ? sceneManager.getCurrentScene() : null;
                if (cs && cs.inputManager && cs.inputManager.setPointerTransform) {
                    cs.inputManager.setPointerTransform(transform);
                }
            };
            installer();
            // 场景可能稍后才创建 InputManager，做几次补装
            setTimeout(installer, 500);
            setTimeout(installer, 1500);
            // 暴露给摇杆使用
            window.__pointerTransform = transform;
        }
        setupOrientation();
        window.addEventListener('resize', () => { applyForceLandscape(); applyUILayoutToDom(); void applyLoginLayout(); });
        window.addEventListener('orientationchange', () => { setTimeout(setupOrientation, 100); });
        
        // 显示登录界面；选择开始/继续后才进入加载页面
        bootGameMenu();
    </script>
</body>
</html>
