<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>张角黄巾起义 - S01 寒风荒野求生</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            overflow: hidden;
        }
        
        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        #gameCanvas {
            border: 2px solid #4CAF50;
            background-color: #2a2a2a;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 100%;
            height: 100%;
        }
        
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        #tutorial-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 20px 40px;
            border-radius: 15px;
            border: 3px solid #2196F3;
            pointer-events: auto;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 0 20px rgba(33, 150, 243, 0.5);
            animation: fadeIn 0.3s ease-in;
        }
        
        #tips-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 20px 40px;
            border-radius: 15px;
            border: 3px solid #4CAF50;
            pointer-events: none;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        
        #tutorial-panel h3 {
            color: #2196F3;
            margin-bottom: 15px;
            font-size: 20px;
        }
        
        #tips-panel h3 {
            color: #4CAF50;
            margin-bottom: 15px;
            font-size: 20px;
        }
        
        #tutorial-panel p {
            font-size: 18px;
            line-height: 1.6;
            color: #ffffff;
            margin-bottom: 20px;
        }
        
        #tips-panel p {
            font-size: 18px;
            line-height: 1.6;
            color: #ffffff;
        }
        
        #tutorial-panel .key {
            display: inline-block;
            background: #2196F3;
            color: #000;
            padding: 5px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 18px;
            margin: 0 3px;
        }
        
        #tips-panel .key {
            display: inline-block;
            background: #4CAF50;
            color: #000;
            padding: 5px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 18px;
            margin: 0 3px;
        }
        
        #tutorial-panel .tutorial-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }
        
        #tutorial-panel button {
            padding: 10px 20px;
            background: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        #tutorial-panel button:hover {
            background: #45a049;
            transform: translateY(-2px);
        }
        
        #tutorial-panel button:active {
            transform: translateY(0);
        }
        
        #tutorial-panel button:disabled {
            background: #666;
            cursor: not-allowed;
            opacity: 0.5;
        }
        
        #tutorial-panel .step-indicator {
            font-size: 14px;
            color: #aaa;
            margin-top: 10px;
        }
        
        #debug-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            pointer-events: none;
        }
        
        #debug-panel div {
            margin: 2px 0;
        }

        /* S01 任务追踪面板（右上角） */
        #quest-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            min-width: 180px;
            max-width: 240px;
            background: rgba(0, 0, 0, 0.75);
            border: 2px solid rgba(255, 193, 7, 0.55);
            border-radius: 10px;
            padding: 10px 14px;
            pointer-events: none;
            font-size: 13px;
        }

        #quest-panel h3 {
            color: #ffc107;
            font-size: 15px;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(255, 193, 7, 0.3);
        }

        #quest-panel h3.quest-done {
            color: #8BC34A;
        }

        #quest-panel ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        #quest-panel li {
            color: #777;
            padding: 2px 0;
            line-height: 1.5;
        }

        #quest-panel li.quest-active {
            color: #fff;
            font-weight: bold;
        }

        #quest-panel li.quest-active::before {
            content: '➤ ';
            color: #ffc107;
        }

        #quest-panel li.quest-done {
            color: #8BC34A;
            text-decoration: line-through;
        }

        #quest-panel li.quest-done::before {
            content: '✓ ';
        }

        /* ===== 触屏虚拟摇杆（复用框架 VirtualJoystickCore） ===== */
        #joystick-zone {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 30%;
            max-width: 280px;
            height: 55%;
            pointer-events: auto;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            z-index: 30;
        }

        /* 摇杆绘制层：覆盖整个游戏容器，只读指针坐标不拦事件 */
        #joystick-overlay {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 600;
        }

        /* 触屏功能按钮：右下竖排（tap 派发对应按键，复用既有键盘处理路径） */
        #touch-buttons {
            position: absolute;
            right: 16px;
            bottom: 18px;
            display: none;
            flex-direction: column;
            gap: 14px;
            z-index: 30;
        }

        #touch-buttons .touch-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 2px solid rgba(76, 175, 80, 0.55);
            background: rgba(30, 30, 30, 0.65);
            color: #fff;
            font-size: 26px;
            line-height: 52px;
            text-align: center;
            pointer-events: auto;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        #touch-buttons .touch-btn:active {
            background: rgba(76, 175, 80, 0.4);
        }

        /* 摄像头控制面板 */
        #camera-control {
            position: absolute;
            top: 10px;
            left: 180px;
            width: 140px;
            height: 140px;
            pointer-events: auto;
            user-select: none;
        }
        
        #camera-control .ring-outer {
            position: absolute;
            top: 0; left: 0;
            width: 140px; height: 140px;
            border-radius: 50%;
            border: 2px solid rgba(76, 175, 80, 0.4);
            background: rgba(0, 0, 0, 0.3);
        }
        
        #camera-control .cam-btn {
            position: absolute;
            width: 28px; height: 28px;
            border-radius: 50%;
            border: 1px solid rgba(76, 175, 80, 0.7);
            background: rgba(30, 30, 30, 0.85);
            color: #4CAF50;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            line-height: 1;
        }
        
        #camera-control .cam-btn:hover {
            background: rgba(76, 175, 80, 0.3);
            transform: scale(1.15);
        }
        
        #camera-control .cam-btn:active {
            background: rgba(76, 175, 80, 0.5);
            transform: scale(0.95);
        }
        
        /* 方向按钮定位（内圈） */
        #camera-control .btn-up    { top: 12px;  left: 56px; }
        #camera-control .btn-down  { bottom: 12px; left: 56px; }
        #camera-control .btn-left  { top: 56px;  left: 12px; }
        #camera-control .btn-right { top: 56px;  right: 12px; }
        
        /* 旋转按钮定位（外圈） */
        #camera-control .btn-rot-left  { top: 22px; left: 14px; }
        #camera-control .btn-rot-right { top: 22px; right: 14px; }
        
        /* 重置按钮（底部中央） */
        #camera-control .btn-reset {
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 32px; height: 18px;
            border-radius: 9px;
            font-size: 10px;
        }
        
        /* 中间推拉按钮（半圆） */
        #camera-control .zoom-group {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 48px; height: 48px;
        }
        
        #camera-control .zoom-btn {
            position: absolute;
            width: 24px; height: 48px;
            border: 1px solid rgba(76, 175, 80, 0.7);
            background: rgba(30, 30, 30, 0.85);
            color: #4CAF50;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }
        
        #camera-control .zoom-btn:hover {
            background: rgba(76, 175, 80, 0.3);
        }
        
        #camera-control .zoom-btn:active {
            background: rgba(76, 175, 80, 0.5);
        }
        
        #camera-control .zoom-in {
            left: 0;
            border-radius: 24px 0 0 24px;
        }
        
        #camera-control .zoom-out {
            right: 0;
            border-radius: 0 24px 24px 0;
        }
        
        #controls-hint {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 14px;
        }
        
        .hidden {
            display: none !important;
        }
        
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
        }
        
        #loading-screen h1 {
            color: #4CAF50;
            margin-bottom: 20px;
        }
        
        .progress-bar {
            width: 300px;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            width: 0%;
            transition: width 0.3s;
        }
        
        /* 技能栏样式 */
        #skill-bar {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }
        
        .skill-slot {
            width: 60px;
            height: 60px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #4CAF50;
            border-radius: 8px;
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .skill-slot:hover {
            border-color: #8BC34A;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.5);
        }
        
        .skill-slot.on-cooldown {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .skill-slot.on-cooldown:hover {
            transform: none;
            box-shadow: none;
        }
        
        .skill-icon {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        
        .skill-hotkey {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 10px;
            color: #4CAF50;
            font-weight: bold;
        }
        
        .skill-cooldown {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            border-radius: 6px;
        }
        
        .skill-name {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: #aaa;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .skill-slot:hover .skill-name {
            opacity: 1;
        }
        
        .skill-mana-cost {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 10px;
            color: #2196F3;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-overlay">
            <div id="tutorial-panel" class="hidden">
                <h3 id="tutorial-title">教程</h3>
                <p id="tutorial-text">教程内容</p>
                <div class="tutorial-buttons">
                    <button id="tutorial-prev-btn" style="display: none;">上一步</button>
                    <button id="tutorial-next-btn">下一步</button>
                </div>
                <div class="step-indicator" id="tutorial-step-indicator"></div>
            </div>
            
            <div id="tips-panel" class="hidden">
                <h3 id="tips-title">提示</h3>
                <p id="tips-text">提示内容</p>
            </div>
            
            <div id="debug-panel">
                <div>FPS: <span id="fps">60</span></div>
                <div>位置: <span id="position">0, 0</span></div>
                <div>生命值: <span id="hp">100/100</span></div>
                <div>阶段: <span id="phase">-</span></div>
                <div>敌人: <span id="enemies">0</span></div>
            </div>

            <!-- S01 任务追踪面板 -->
            <div id="quest-panel">
                <h3 id="quest-title">荒原求生</h3>
                <ul id="quest-steps"></ul>
            </div>
            
            <!-- 摄像头控制面板 -->
            <div id="camera-control">
                <div class="ring-outer"></div>
                <!-- 方向按钮 -->
                <div class="cam-btn btn-up" data-action="up" title="抬高仰角">▲</div>
                <div class="cam-btn btn-down" data-action="down" title="降低仰角">▼</div>
                <div class="cam-btn btn-left" data-action="left" title="左平移">◀</div>
                <div class="cam-btn btn-right" data-action="right" title="右平移">▶</div>
                <!-- 旋转按钮（外圈） -->
                <div class="cam-btn btn-rot-left" data-action="rot-left" title="左旋">↺</div>
                <div class="cam-btn btn-rot-right" data-action="rot-right" title="右旋">↻</div>
                <!-- 重置按钮 -->
                <div class="cam-btn btn-reset" data-action="reset" title="重置镜头">R</div>
                <!-- 中间推拉（半圆） -->
                <div class="zoom-group">
                    <div class="zoom-btn zoom-in" data-action="zoom-in" title="推进">+</div>
                    <div class="zoom-btn zoom-out" data-action="zoom-out" title="拉远">−</div>
                </div>
            </div>
            
            <!-- <div id="controls-hint">
                WASD/方向键: 移动 | 鼠标点击: 移动 | E: 拾取 | C: 属性/装备 | B: 背包 | 1-3: 技能
            </div> -->
            
            <div id="skill-bar" style="display: none;">
                <div class="skill-slot" data-skill-index="0">
                    <div class="skill-icon">⚔️</div>
                    <div class="skill-hotkey">1</div>
                    <div class="skill-mana-cost">0</div>
                    <div class="skill-name">普通攻击</div>
                </div>
                <div class="skill-slot" data-skill-index="1">
                    <div class="skill-icon">💥</div>
                    <div class="skill-hotkey">2</div>
                    <div class="skill-mana-cost">10</div>
                    <div class="skill-name">重击</div>
                </div>
                <div class="skill-slot" data-skill-index="2">
                    <div class="skill-icon">🔥</div>
                    <div class="skill-hotkey">3</div>
                    <div class="skill-mana-cost">15</div>
                    <div class="skill-name">火球术</div>
                </div>
                <div class="skill-slot" data-skill-index="3">
                    <div class="skill-icon">💚</div>
                    <div class="skill-hotkey">4</div>
                    <div class="skill-mana-cost">20</div>
                    <div class="skill-name">治疗术</div>
                </div>
            </div>
        </div>
        
        <div id="loading-screen">
            <h1>张角黄巾起义</h1>
            <h2>S01：寒风荒野求生</h2>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <p id="loading-text">加载中...</p>
        </div>

        <!-- 触屏虚拟摇杆：方向热区 + 扇形指示绘制层（仅触屏设备由 JS 启用） -->
        <canvas id="joystick-overlay"></canvas>
        <div id="joystick-zone"></div>
        <div id="touch-buttons">
            <div class="touch-btn" data-key="c" title="角色">🧙</div>
            <div class="touch-btn" data-key="b" title="背包">🎒</div>
            <div class="touch-btn" data-key="e" title="交互">✋</div>
        </div>
    </div>
    
    <script type="module">
        import { Scene3DHostScene } from './scenes/Scene3DHostScene.js';
        import { Act2Scene } from './scenes/Act2Scene.js';
        import { Act3Scene } from './scenes/Act3Scene.js';
        import { Act4Scene } from './scenes/Act4Scene.js';
        import { Act5Scene } from './scenes/Act5Scene.js';
        import { Act6Scene } from './scenes/Act6Scene.js';
        import { SceneManager } from '../../src/core/SceneManager.js';
        import { AssetManager } from '../../src/core/AssetManager.js';
        import { DialogueBox } from '../../src/ui/DialogueBox.js';
        import { SkillTreePanel } from '../../src/ui/SkillTreePanel.js';
        import { NotificationSystem } from '../../src/ui/NotificationSystem.js';
        import { PortraitsConfig } from './data/PortraitsConfig.js';
        import { ThreeBackend } from '../../src/rendering/backends/ThreeBackend.js';
        import { setupVirtualJoystick } from '../../src/platform/touch/VirtualJoystickCore.js';
        
        // 渲染后端（3D）
        let backend = null;
        
        // 场景管理器
        let sceneManager = null;
        let assetManager = null;
        
        // UI组件
        let dialogueBox = null;
        let skillTreePanel = null;
        let notificationSystem = null;
        
        // 游戏状态
        let scene = null;
        let lastTime = performance.now();
        let fps = 60;
        let frameCount = 0;
        let fpsTime = 0;
        
        // 获取元素
        const canvas = document.getElementById('gameCanvas');
        // 3D 模式：canvas 交给 ThreeBackend，不直接获取 2d context
        
        // Canvas 自适应容器大小
        function resizeCanvas() {
            const container = canvas.parentElement;
            const cw = container ? container.clientWidth : window.innerWidth;
            const ch = container ? container.clientHeight : window.innerHeight;
            canvas.width = cw;
            canvas.height = ch;
            
            if (backend) {
                backend.resize(cw, ch);
            }
            
            // 通知当前场景更新尺寸
            if (sceneManager) {
                sceneManager.setRenderSize(cw, ch);
                const currentScene = sceneManager.getCurrentScene();
                if (currentScene && currentScene.onResize) {
                    currentScene.onResize(cw, ch);
                }
            }
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        const loadingScreen = document.getElementById('loading-screen');
        const progressFill = document.getElementById('progress-fill');
        const loadingText = document.getElementById('loading-text');
        const tutorialPanel = document.getElementById('tutorial-panel');
        const tutorialTitle = document.getElementById('tutorial-title');
        const tutorialText = document.getElementById('tutorial-text');
        const tutorialNextBtn = document.getElementById('tutorial-next-btn');
        const tutorialPrevBtn = document.getElementById('tutorial-prev-btn');
        const tutorialStepIndicator = document.getElementById('tutorial-step-indicator');
        
        const tipsPanel = document.getElementById('tips-panel');
        const tipsTitle = document.getElementById('tips-title');
        const tipsText = document.getElementById('tips-text');
        
        // 当前教程数据
        let currentTutorialData = null;
        
        // 调试面板元素
        const fpsElement = document.getElementById('fps');
        const positionElement = document.getElementById('position');
        const hpElement = document.getElementById('hp');
        const phaseElement = document.getElementById('phase');
        const enemiesElement = document.getElementById('enemies');
        
        // 教程按钮事件
        tutorialNextBtn.addEventListener('click', () => {
            if (scene && scene.tutorialSystem) {
                const hasNext = scene.tutorialSystem.nextStep();
                if (!hasNext) {
                    // 没有下一步了，隐藏教程
                    hideTutorial();
                }
            }
        });
        
        tutorialPrevBtn.addEventListener('click', () => {
            if (scene && scene.tutorialSystem) {
                scene.tutorialSystem.previousStep();
            }
        });
        
        // 为场景设置回调
        function setupSceneCallbacks(sceneInstance) {
            if (!sceneInstance || !sceneInstance.tutorialSystem) {
                console.warn('setupSceneCallbacks: 场景或教程系统不存在');
                return;
            }
            
            console.log('setupSceneCallbacks: 为场景设置回调');
            
            // 设置教程回调
            sceneInstance.tutorialSystem.onShow((data) => {
                console.log('index.html: onShow 回调被触发');
                currentTutorialData = data;
                
                // 判断是渐进式提示还是基础教程
                const isProgressiveTip = data.tutorialId && data.tutorialId.startsWith('progressive_tip_');
                
                // 处理两种回调格式：
                // 1. showTutorial 调用时传入 tutorial 对象
                // 2. showStep 调用时传入 stepData 对象
                if (data.step && data.step.text) {
                    // stepData 格式（多步教程）
                    if (isProgressiveTip) {
                        // 渐进式提示：使用提示面板（无按钮）
                        showTips(data.tutorialTitle, data.step.text);
                    } else {
                        // 基础教程：使用教程面板（有按钮）
                        showTutorial(
                            data.tutorialTitle, 
                            data.step.text,
                            data.stepIndex,
                            data.totalSteps,
                            data.isLastStep
                        );
                    }
                } else if (data.title) {
                    // tutorial 对象格式（首次显示）
                    if (isProgressiveTip) {
                        // 渐进式提示：使用提示面板（无按钮）
                        showTips(data.title, data.steps[0]?.text || '');
                    } else {
                        // 基础教程：使用教程面板（有按钮）
                        showTutorial(
                            data.title, 
                            data.steps[0]?.text || '',
                            0,
                            data.steps.length,
                            data.steps.length === 1
                        );
                    }
                }
            });
            
            sceneInstance.tutorialSystem.onHide(() => {
                hideTutorial();
                hideTips();
            });
            
            // 设置对话系统回调（如果有）
            if (sceneInstance.dialogueSystem) {
                // 创建或更新 DialogueBox
                if (!dialogueBox) {
                    dialogueBox = new DialogueBox({
                        x: 100,
                        y: 370,
                        width: 600,
                        height: 200,
                        visible: false,
                        dialogueSystem: sceneInstance.dialogueSystem,
                        portraits: PortraitsConfig
                    });
                } else {
                    dialogueBox.setDialogueSystem(sceneInstance.dialogueSystem);
                }
                
                // 当对话开始时显示对话框
                sceneInstance.dialogueSystem.onStart(() => {
                    dialogueBox.show();
                });
                
                // 当对话结束时隐藏对话框
                sceneInstance.dialogueSystem.onEnd(() => {
                    dialogueBox.hide();
                });
                
                // 如果对话已经在进行中，立即显示对话框
                if (sceneInstance.dialogueSystem.isDialogueActive()) {
                    dialogueBox.show();
                }
            }
            
            // 设置通知系统回调（用于第二幕）
            if (sceneInstance.setNotificationCallback) {
                sceneInstance.setNotificationCallback((message, type) => {
                    if (notificationSystem) {
                        notificationSystem.addNotification(message, type);
                    }
                });
            }
            
            // 设置场景提示回调（复用提示面板）
            if (sceneInstance.setHintCallbacks) {
                sceneInstance.setHintCallbacks(
                    (text, title) => showTips(title, text),
                    () => hideTips()
                );
            }
            
            // 设置玩家实体引用（用于背包系统）
            if (sceneInstance.setPlayerEntity && sceneInstance.playerEntity) {
                sceneInstance.setPlayerEntity(sceneInstance.playerEntity);
            }
        }

        // 强制启动（软件渲染模式）
        let forceAllowSoftware = false;
        window.forceInit = async function() {
            forceAllowSoftware = true;
            const loadingScreen = document.getElementById('loading-screen');
            loadingScreen.innerHTML = `
                <h1 style="color:#4CAF50;">张角黄巾起义</h1>
                <h2>S01：寒风荒野求生</h2>
                <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
                <p id="loading-text">加载中（软件渲染模式）...</p>
            `;
            initGame();
        };
        
        // 初始化游戏
        async function initGame() {
            try {
                // 模拟加载过程
                updateLoading(0, '检测 WebGL 环境...');
                
                // 预检 WebGL 硬件加速
                const probe = ThreeBackend.probeWebGL();
                console.log('WebGL 检测结果:', probe);
                
                if (!probe.supported) {
                    showWebGLError('您的浏览器不支持 WebGL，无法运行 3D 模式。');
                    return;
                }
                if (probe.softwareOnly && !forceAllowSoftware) {
                    showWebGLError(
                        '检测到 WebGL 仅使用软件渲染（无硬件加速），3D 性能会非常差。<br><br>' +
                        '<b>解决方法：</b><br>' +
                        '1. 打开 chrome://settings/system → 启用「使用硬件加速模式」<br>' +
                        '2. 打开 chrome://flags/#ignore-gpu-blocklist → Enabled<br>' +
                        '3. 更新显卡驱动<br>' +
                        '4. 重启浏览器<br><br>' +
                        '<small>渲染器: ' + (probe.renderer || 'unknown') + '</small>',
                        true // 允许强制继续
                    );
                    return;
                }
                
                updateLoading(10, '初始化 3D 渲染后端...');
                
                // 初始化 ThreeBackend
                backend = new ThreeBackend();
                await backend.init(canvas, {
                    gameWidth: canvas.width,
                    gameHeight: canvas.height,
                    allowSoftwareWebGL: forceAllowSoftware
                });
                console.log('ThreeBackend 初始化完成');
                await sleep(300);
                
                updateLoading(25, '加载核心系统...');
                // 创建并初始化 AssetManager
                assetManager = new AssetManager();
                assetManager.setAssetBasePath('assets/');
                assetManager.loadPlaceholderAssets(); // 加载占位符资源
                // 将 assetManager 注入 3D 后端，用于实体贴图
                backend.assetManager = assetManager;
                await sleep(500);
                
                updateLoading(50, '创建场景管理器...');
                sceneManager = new SceneManager();
                sceneManager.setRenderSize(canvas.width, canvas.height);
                await sleep(300);
                
                updateLoading(60, '注册场景...');
                // 创建并注册 S01 数据驱动 3D 宿主（M0：工程数据 + 3D 渲染）
                const hostScene = new Scene3DHostScene();
                hostScene.assetManager = assetManager;
                hostScene.renderBackend = backend;  // 注入 3D 后端
                sceneManager.registerScene('S01Host', hostScene);
                sceneManager.registerScene('S01HostScene', hostScene); // 兼容别名
                
                // 创建并注册第二幕场景
                const act2Scene = new Act2Scene();
                act2Scene.assetManager = assetManager;
                sceneManager.registerScene('Act2Scene', act2Scene);
                
                // 创建并注册第三幕场景
                const act3Scene = new Act3Scene();
                act3Scene.assetManager = assetManager;
                sceneManager.registerScene('Act3Scene', act3Scene);
                
                // 创建并注册第四幕场景
                const act4Scene = new Act4Scene();
                act4Scene.assetManager = assetManager;
                sceneManager.registerScene('Act4Scene', act4Scene);
                
                // 创建并注册第五幕场景
                const act5Scene = new Act5Scene();
                act5Scene.assetManager = assetManager;
                sceneManager.registerScene('Act5Scene', act5Scene);
                
                // 创建并注册第六幕场景
                const act6Scene = new Act6Scene();
                act6Scene.assetManager = assetManager;
                sceneManager.registerScene('Act6Scene', act6Scene);
                
                // 设置场景管理器引用
                hostScene.setSceneManager(sceneManager);
                act2Scene.setSceneManager(sceneManager);
                act3Scene.setSceneManager(sceneManager);
                act4Scene.setSceneManager(sceneManager);
                act5Scene.setSceneManager(sceneManager);
                act6Scene.setSceneManager(sceneManager);
                
                // 初始化通知系统
                notificationSystem = new NotificationSystem({
                    x: 10,
                    y: 100,
                    maxNotifications: 5
                });
                
                // 注册场景后直接进入 S01 数据驱动宿主
                scene = hostScene;
                await sleep(300);
                
                updateLoading(90, '进入 S01 宿主场景...');
                sceneManager.switchTo('S01Host');
                await sleep(300);
                
                // 场景进入后设置教程回调
                console.log('设置教程回调...');
                setupSceneCallbacks(hostScene);
                setupSceneCallbacks(act2Scene);
                setupSceneCallbacks(act3Scene);
                
                // S01：tip_1（醒来提示）由触发条件驱动（开场对话播完后显示），不再强制弹出
                
                updateLoading(100, '完成！');
                await sleep(500);
                
                // 隐藏加载屏幕
                loadingScreen.style.display = 'none';
                
                console.log('准备启动游戏循环...');
                
                // 开始游戏循环
                requestAnimationFrame(gameLoop);
                
                console.log('游戏初始化完成，游戏循环已启动');
            } catch (error) {
                console.error('游戏初始化失败:', error);
                loadingText.textContent = '加载失败: ' + error.message;
            }
        }
        
        // 更新加载进度
        function updateLoading(progress, text) {
            progressFill.style.width = progress + '%';
            loadingText.textContent = text;
        }
        
        // 延迟函数
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
        
        // 显示教程（基础教程，有按钮）
        function showTutorial(title, text, stepIndex = 0, totalSteps = 1, isLastStep = true) {
            tutorialTitle.textContent = title;
            // 使用innerHTML支持HTML标签
            tutorialText.innerHTML = text;
            tutorialPanel.classList.remove('hidden');
            
            // 更新步骤指示器
            if (totalSteps > 1) {
                tutorialStepIndicator.textContent = `步骤 ${stepIndex + 1} / ${totalSteps}`;
                tutorialStepIndicator.style.display = 'block';
            } else {
                tutorialStepIndicator.style.display = 'none';
            }
            
            // 更新按钮状态
            // 上一步按钮：只在不是第一步时显示
            if (stepIndex > 0) {
                tutorialPrevBtn.style.display = 'inline-block';
            } else {
                tutorialPrevBtn.style.display = 'none';
            }
            
            // 下一步按钮：最后一步显示"完成"，其他显示"下一步"
            if (isLastStep) {
                tutorialNextBtn.textContent = '完成';
            } else {
                tutorialNextBtn.textContent = '下一步';
            }
        }
        
        // 隐藏教程
        function hideTutorial() {
            tutorialPanel.classList.add('hidden');
            currentTutorialData = null;
        }
        
        // 显示提示（渐进式提示，无按钮）
        function showTips(title, text) {
            tipsTitle.textContent = title;
            // 使用innerHTML支持HTML标签
            tipsText.innerHTML = text;
            tipsPanel.classList.remove('hidden');
        }
        
        // 隐藏提示
        function hideTips() {
            tipsPanel.classList.add('hidden');
        }
        
        // 目标帧率限制
        const TARGET_FPS = 60;
        const FRAME_INTERVAL = 1000 / TARGET_FPS;
        let lastFrameTime = 0;
        
        // 游戏循环
        function gameLoop(currentTime) {
            // 帧率限制：跳过过快的帧
            const elapsed = currentTime - lastFrameTime;
            if (elapsed < FRAME_INTERVAL) {
                requestAnimationFrame(gameLoop);
                return;
            }
            lastFrameTime = currentTime - (elapsed % FRAME_INTERVAL);
            
            const deltaTime = (currentTime - lastTime) / 1000;
            lastTime = currentTime;
            
            // 计算 FPS
            frameCount++;
            fpsTime += deltaTime;
            if (fpsTime >= 1.0) {
                fps = frameCount;
                frameCount = 0;
                fpsTime = 0;
            }
            
            // 清空画布（3D 模式由 ThreeBackend.beginFrame 处理）
            backend.beginFrame();
            
            // 更新和渲染场景
            if (sceneManager) {
                sceneManager.update(deltaTime);
                // 3D 世界渲染：传入 backend
                sceneManager.render(backend);
                
                // HUD ctx 用于 2D UI 叠加
                const hudCtx = backend.getHUDContext();
                
                // 更新和渲染技能树面板
                if (skillTreePanel && hudCtx) {
                    skillTreePanel.render(hudCtx);
                }
                
                // 更新和渲染通知系统
                if (notificationSystem && hudCtx) {
                    notificationSystem.update(deltaTime * 1000);
                    notificationSystem.render(hudCtx);
                }
                
                // 获取当前场景
                const currentScene = sceneManager.getCurrentScene();
                
                // 如果场景切换了，设置新场景的回调
                if (currentScene !== scene) {
                    console.log('场景切换检测到，设置新场景回调');
                    scene = currentScene;
                    if (scene) {
                        setupSceneCallbacks(scene);
                        
                        // 如果是第二幕场景，设置玩家实体和背包面板
                        if (scene.setPlayerEntity && scene.playerEntity) {
                            scene.setPlayerEntity(scene.playerEntity);
                        }
                        
                        // 重置技能树面板（因为不同场景可能有不同的系统实例）
                        if (skillTreePanel) {
                            skillTreePanel.hide();
                            skillTreePanel = null;
                        }
                    }
                }
                
                // 更新调试信息
                if (scene) {
                    updateDebugInfo();
                }
            }
            
            // 3D 后端提交渲染
            if (backend) backend.endFrame();
            
            requestAnimationFrame(gameLoop);
        }
        
        // 更新调试信息
        function updateDebugInfo() {
            if (!scene) return;
            
            fpsElement.textContent = fps;
            
            // 使用 playerEntity（两幕都有）
            if (scene.playerEntity) {
                const transform = scene.playerEntity.getComponent('transform');
                if (transform) {
                    positionElement.textContent = 
                        `${Math.floor(transform.position.x)}, ${Math.floor(transform.position.y)}`;
                } else {
                    positionElement.textContent = '-';
                }
                
                const stats = scene.playerEntity.getComponent('stats');
                if (stats) {
                    hpElement.textContent = `${Math.floor(stats.hp)}/${stats.maxHp}`;
                }
            } else {
                positionElement.textContent = '-';
                hpElement.textContent = '-';
            }
            
            // tutorialPhase（两幕都有）
            phaseElement.textContent = scene.tutorialPhase || '-';
            
            // enemyEntities（两幕都有，第二幕为空数组）
            if (scene.enemyEntities && Array.isArray(scene.enemyEntities)) {
                const aliveEnemies = scene.enemyEntities.filter(enemy => {
                    const stats = enemy.getComponent('stats');
                    return stats && stats.hp > 0;
                });
                enemiesElement.textContent = aliveEnemies.length;
            } else {
                enemiesElement.textContent = '0';
            }
            
            // 更新 S01 任务追踪面板
            updateQuestPanel();
            
            // 更新技能栏
            updateSkillBar();
        }
        
        // 更新 S01 任务追踪面板（读场景 getQuestState）
        let lastQuestSignature = '';
        function updateQuestPanel() {
            const questPanel = document.getElementById('quest-panel');
            if (!questPanel) return;
            
            // 第二幕之后隐藏任务面板
            if (!scene.getQuestState) {
                questPanel.style.display = 'none';
                return;
            }
            questPanel.style.display = 'block';
            
            const quest = scene.getQuestState();
            const signature = quest.stepIndex + '|' + quest.completed + '|' +
                quest.steps.map(s => s.title).join(',');
            if (signature === lastQuestSignature) return;  // 状态未变不重绘
            lastQuestSignature = signature;
            
            const titleEl = document.getElementById('quest-title');
            const stepsEl = document.getElementById('quest-steps');
            if (titleEl) {
                titleEl.textContent = quest.completed ? `${quest.title}（已完成）` : quest.title;
                titleEl.classList.toggle('quest-done', quest.completed);
            }
            if (stepsEl) {
                stepsEl.innerHTML = quest.steps.map(step => {
                    const cls = step.state === 'done' ? 'quest-done' : 
                                step.state === 'active' ? 'quest-active' : '';
                    return `<li class="${cls}">${step.title}</li>`;
                }).join('');
            }
        }
        
        // 更新技能栏显示
        function updateSkillBar() {
            if (!scene || !scene.playerEntity) return;
            
            const skills = scene.playerEntity.getComponent('skills');
            if (!skills) return;
            
            const skillSlots = document.querySelectorAll('.skill-slot');
            skillSlots.forEach((slot, index) => {
                const skill = skills.skills[index];
                if (!skill) return;
                
                // 检查冷却
                const cooldownRemaining = skills.getCooldownRemaining(skill.id);
                const isOnCooldown = cooldownRemaining > 0;
                
                // 更新样式
                if (isOnCooldown) {
                    slot.classList.add('on-cooldown');
                    // 显示冷却时间
                    let cooldownDiv = slot.querySelector('.skill-cooldown');
                    if (!cooldownDiv) {
                        cooldownDiv = document.createElement('div');
                        cooldownDiv.className = 'skill-cooldown';
                        slot.appendChild(cooldownDiv);
                    }
                    cooldownDiv.textContent = Math.ceil(cooldownRemaining);
                } else {
                    slot.classList.remove('on-cooldown');
                    const cooldownDiv = slot.querySelector('.skill-cooldown');
                    if (cooldownDiv) {
                        cooldownDiv.remove();
                    }
                }
            });
        }
        
        // 技能栏点击事件
        document.querySelectorAll('.skill-slot').forEach((slot, index) => {
            slot.addEventListener('click', () => {
                if (!scene || !scene.playerEntity) return;
                useSkill(index);
            });
        });
        
        // 使用技能
        function useSkill(skillIndex) {
            if (!scene || !scene.combatSystem) return;
            
            const skills = scene.playerEntity.getComponent('skills');
            if (!skills) return;
            
            const skill = skills.skills[skillIndex];
            if (!skill) return;
            
            // 尝试使用技能
            scene.combatSystem.useSkill(scene.playerEntity, skill.id);
        }
        
        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            // 空格键 - 继续对话
            // S01 修复：setupSceneCallbacks 会把共享 dialogueBox 重绑到后续幕的
            // DialogueSystem，空格必须优先走当前场景自己的对话框（与渲染中的实例一致）
            if (e.code === 'Space') {
                const activeBox = (scene?.dialogueBox && scene.dialogueBox.visible) ? scene.dialogueBox : dialogueBox;
                if (activeBox && activeBox.visible) {
                    e.preventDefault();
                    activeBox.continueDialogue();
                    return;
                }
            }
            
            // K键 - 打开技能树
            if (e.code === 'KeyK') {
                // 获取当前场景的技能树系统和玩家
                const currentSkillTreeSystem = scene?.skillTreeSystem || scene?.getSkillTreeSystem?.();
                const currentPlayer = scene?.player;
                
                if (skillTreePanel) {
                    skillTreePanel.toggle();
                } else if (currentSkillTreeSystem && currentPlayer) {
                    // 创建技能树面板
                    skillTreePanel = new SkillTreePanel({
                        x: 100,
                        y: 50,
                        width: 600,
                        height: 500,
                        skillTreeSystem: currentSkillTreeSystem,
                        character: currentPlayer
                    });
                    skillTreePanel.show();
                } else {
                    console.log('技能树系统或玩家数据不可用');
                }
                return;
            }
            
            // B键 - 打开组合背包面板（场景面板接管，与 2D 一致）
            if (e.code === 'KeyB') {
                if (scene?.backpackPanel) {
                    scene.backpackPanel.toggle();
                }
                return;
            }
            
            // C键 - 打开角色信息面板（组合背包面板三别名之一，与 2D 一致）
            if (e.code === 'KeyC') {
                if (scene?.backpackPanel) {
                    scene.backpackPanel.toggle();
                }
                return;
            }
            
            if (!scene || !scene.playerEntity) return;
            
            // 技能快捷键 1-4
            if (e.key >= '1' && e.key <= '4') {
                const skillIndex = parseInt(e.key) - 1;
                useSkill(skillIndex);
            }
        });
        
        // 鼠标移动事件
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            if (skillTreePanel && skillTreePanel.isVisible) {
                skillTreePanel.handleMouseMove(mouseX, mouseY);
            }
            
            if (dialogueBox && dialogueBox.visible) {
                dialogueBox.handleMouseMove(mouseX, mouseY);
            }
        });
        
        // 鼠标点击事件
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            // 优先处理技能树面板点击
            if (skillTreePanel && skillTreePanel.isVisible) {
                if (skillTreePanel.handleClick(mouseX, mouseY)) {
                    return;
                }
            }
            
            // 对话框点击（S01：同空格键，优先走当前场景自己的对话框）
            const activeBox = (scene?.dialogueBox && scene.dialogueBox.visible) ? scene.dialogueBox : dialogueBox;
            if (activeBox && activeBox.visible) {
                activeBox.handleMouseClick(mouseX, mouseY);
            }
        });
        
        // 右键菜单事件（抑制浏览器菜单；组合面板右键由场景自己的输入链处理）
        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });
        
        // 启动游戏
        initGame();
        
        // 调试句柄（与 2D demo 调试惯例一致：控制台 sceneManager.getCurrentScene()）。
        // initGame 为异步初始化，这里必须用 getter 实时取引用，不能快照赋值。
        Object.defineProperty(window, 'sceneManager', { get: () => sceneManager });

        // ===== 触屏控制：虚拟摇杆 + 功能按钮（复用框架 VirtualJoystickCore） =====
        // 摇杆把方向换算为方向键事件派发到 window，InputManager（window 级监听）
        // 与 MovementSystem 采集层天然复用；功能按钮 tap 派发对应按键，
        // 复用既有键盘处理路径（B/C 面板切换、E 交互）。仅触屏设备启用。
        (function setupTouchControls() {
            const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
            if (!isTouch) return;

            document.getElementById('touch-buttons').style.display = 'flex';

            const pressKey = (key, code) => window.dispatchEvent(new KeyboardEvent('keydown', { key, code, bubbles: true }));
            const releaseKey = (key, code) => window.dispatchEvent(new KeyboardEvent('keyup', { key, code, bubbles: true }));
            setupVirtualJoystick(pressKey, releaseKey, { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' });

            // 合成键盘事件必须带 code：3D 的 B/C 分支按 e.code（KeyB/KeyC）路由
            const KEY_CODES = { b: 'KeyB', c: 'KeyC', e: 'KeyE' };
            document.querySelectorAll('#touch-buttons .touch-btn').forEach(btn => {
                btn.addEventListener('touchstart', (ev) => {
                    ev.preventDefault();
                    const key = btn.dataset.key;
                    pressKey(key, KEY_CODES[key] || '');
                    setTimeout(() => releaseKey(key, KEY_CODES[key] || ''), 160);
                }, { passive: false });
            });
        })();
        
        // ===== 摄像头控制面板逻辑 =====
        (function setupCameraControl() {
            const panel = document.getElementById('camera-control');
            if (!panel) return;
            
            const PITCH_STEP = 5;    // 仰角步进（度）
            const YAW_STEP = 10;     // 旋转步进（度）
            const PAN_STEP = 50;     // 平移步进（世界单位）
            const ZOOM_STEP = 100;   // 推拉步进
            
            let holdInterval = null;
            
            function getCamera3D() {
                return backend?.camera ?? null;
            }
            
            function doAction(action) {
                const cam = getCamera3D();
                if (!cam) return;
                
                switch (action) {
                    case 'up':
                        cam.setAngle(Math.min(cam.pitchDeg + PITCH_STEP, 85), cam.yawDeg);
                        break;
                    case 'down':
                        cam.setAngle(Math.max(cam.pitchDeg - PITCH_STEP, 5), cam.yawDeg);
                        break;
                    case 'left':
                        cam.pan(-PAN_STEP, 0);
                        break;
                    case 'right':
                        cam.pan(PAN_STEP, 0);
                        break;
                    case 'rot-left':
                        cam.setAngle(cam.pitchDeg, cam.yawDeg - YAW_STEP);
                        break;
                    case 'rot-right':
                        cam.setAngle(cam.pitchDeg, cam.yawDeg + YAW_STEP);
                        break;
                    case 'zoom-in':
                        cam.setDistance(cam.distance - ZOOM_STEP);
                        break;
                    case 'zoom-out':
                        cam.setDistance(cam.distance + ZOOM_STEP);
                        break;
                    case 'reset':
                        cam.pitchDeg = 30;
                        cam.yawDeg = 45;
                        cam.setDistance(1500);
                        cam.resetPanOffset();
                        break;
                }
            }
            
            // 按下即触发，长按重复
            function startHold(action) {
                doAction(action);
                holdInterval = setInterval(() => doAction(action), 120);
            }
            
            function stopHold() {
                if (holdInterval) {
                    clearInterval(holdInterval);
                    holdInterval = null;
                }
            }
            
            panel.addEventListener('pointerdown', (e) => {
                const btn = e.target.closest('[data-action]');
                if (!btn) return;
                e.preventDefault();
                startHold(btn.dataset.action);
            });
            
            panel.addEventListener('pointerup', stopHold);
            panel.addEventListener('pointerleave', stopHold);
            panel.addEventListener('pointercancel', stopHold);
        })();
    </script>
</body>
</html>
